<title>ออลเวย์ทรี แบ็คออฟฟิศ</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --ground:#F1F4F0; --surface:#FFFFFF; --surface-2:#F6F9F5; --field:#F1F4F0;
  --ink:#16211A; --ink-2:#4C5C52; --ink-3:#7E8E84;
  --green:#0B8636; --green-deep:#07642A; --green-tint:#E2F0E7; --green-soft:#F0F7F2;
  --brown:#7A5B3C; --brown-tint:#EEE4D9;
  --warn:#A96C12; --warn-tint:#F7EDDC; --danger:#AF3A2B; --danger-tint:#F8E5E2;
  --info:#2A6B8C; --info-tint:#E1EEF4;
  --sh1:0 1px 2px rgba(16,40,25,.05), 0 4px 14px rgba(16,40,25,.05);
  --sh2:0 2px 8px rgba(16,40,25,.07), 0 18px 44px rgba(16,40,25,.11);
  --rl:24px; --rm:16px; --rs:10px;
  --sans:'Noto Sans Thai','Prompt',system-ui,sans-serif;
  --disp:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans Thai',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1411; --surface:#161F1A; --surface-2:#1C2620; --field:#212C25;
    --ink:#E7EFE8; --ink-2:#A6B6AA; --ink-3:#78887E;
    --green:#4CBE73; --green-deep:#3EA862; --green-tint:#1B3125; --green-soft:#152219;
    --brown:#C39C74; --brown-tint:#2B241C;
    --warn:#D9A758; --warn-tint:#2E2416; --danger:#E07A6A; --danger-tint:#33201C;
    --info:#77B6D4; --info-tint:#182A33;
    --sh1:0 1px 2px rgba(0,0,0,.30), 0 4px 14px rgba(0,0,0,.24);
    --sh2:0 2px 8px rgba(0,0,0,.34), 0 18px 44px rgba(0,0,0,.40);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1411; --surface:#161F1A; --surface-2:#1C2620; --field:#212C25;
  --ink:#E7EFE8; --ink-2:#A6B6AA; --ink-3:#78887E;
  --green:#4CBE73; --green-deep:#3EA862; --green-tint:#1B3125; --green-soft:#152219;
  --brown:#C39C74; --brown-tint:#2B241C;
  --warn:#D9A758; --warn-tint:#2E2416; --danger:#E07A6A; --danger-tint:#33201C;
  --info:#77B6D4; --info-tint:#182A33;
  --sh1:0 1px 2px rgba(0,0,0,.30), 0 4px 14px rgba(0,0,0,.24);
  --sh2:0 2px 8px rgba(0,0,0,.34), 0 18px 44px rgba(0,0,0,.40);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:500;margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-deep);text-underline-offset:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* shell */
#root{min-height:100vh}
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.side{background:var(--surface);box-shadow:var(--sh1);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 18px}
.brand .mark{width:34px;height:34px;border-radius:12px;background:var(--green);display:grid;place-items:center;flex:none;box-shadow:var(--sh1)}
.brand .mark svg{width:20px;height:20px}
.brand b{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.2px;display:block;line-height:1.15}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:transparent;border-radius:var(--rs);cursor:pointer;text-align:left;color:var(--ink-2);font-size:14px;transition:background .16s,color .16s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--green-tint);color:var(--green-deep);font-weight:600}
.nav .ic{width:18px;text-align:center;flex:none;opacity:.9}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:8px}
.main{padding:22px 28px 90px;max-width:1400px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:25px}
.page-head .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:9px 17px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:var(--sh1);transition:transform .14s,box-shadow .18s,background .16s;font-size:14px;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-deep)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2);padding:8px 12px}
.btn.ghost:hover{background:var(--surface-2);box-shadow:none;transform:none;color:var(--ink)}
.btn.danger{background:var(--danger-tint);color:var(--danger)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.xs{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* cards + layout */
.card{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh1);padding:20px 22px}
.card.tight{padding:14px 16px}
.card h3{font-size:16px;margin-bottom:2px}
.card .card-sub{color:var(--ink-3);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown);font-weight:600;font-family:var(--disp)}

/* stat tiles */
.stat{background:var(--surface);border-radius:var(--rm);box-shadow:var(--sh1);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat .lbl{font-size:12.5px;color:var(--ink-3)}
.stat .val{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em}
.stat .foot{font-size:12px;color:var(--ink-3)}
.stat.accent{background:var(--green-tint)}
.stat.accent .val,.stat.accent .lbl{color:var(--green-deep)}

/* fields */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
label.f>span{font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  background:var(--field);border:0;border-radius:var(--rs);padding:9px 12px;width:100%;transition:box-shadow .16s,background .16s;font-size:14px}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:0 0 0 2px var(--green);background:var(--surface)}
textarea{resize:vertical;min-height:74px;line-height:1.6}
input.num,td input{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=file]{font-size:13px}
.seg{display:inline-flex;background:var(--field);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:500}
.search{position:relative;min-width:200px;flex:1;max-width:340px}
.search input{padding-left:34px}
.search .mg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;font-size:13px}

/* tables */
.tw{overflow-x:auto;border-radius:var(--rm)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;white-space:nowrap;font-family:var(--disp)}
td{padding:10px 12px;vertical-align:middle}
tbody tr{background:var(--surface);transition:background .14s}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr:hover{background:var(--green-soft)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.tw table tbody tr td:last-child{white-space:nowrap}
.tw input[type=number]::-webkit-outer-spin-button,.tw input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tw input[type=number]{-moz-appearance:textfield}
.tw td>input,.tw td>select{min-width:0}
.tw table tbody tr td:first-child{border-radius:10px 0 0 10px}
.tw table tbody tr td:last-child{border-radius:0 10px 10px 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--field);color:var(--ink-2)}
.chip.g{background:var(--green-tint);color:var(--green-deep)}
.chip.w{background:var(--warn-tint);color:var(--warn)}
.chip.d{background:var(--danger-tint);color:var(--danger)}
.chip.i{background:var(--info-tint);color:var(--info)}
.chip.b{background:var(--brown-tint);color:var(--brown)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.filt{border:0;background:var(--field);color:var(--ink-2);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13px;transition:background .15s}
.filt:hover{background:var(--green-soft)}
.filt.on{background:var(--green);color:#fff}

/* modal */
.ov{position:fixed;inset:0;background:rgba(12,24,17,.44);backdrop-filter:blur(3px);display:grid;place-items:center;padding:22px;z-index:60;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh2);width:min(900px,100%);max-height:92vh;overflow:auto;padding:24px 26px;animation:pop .2s cubic-bezier(.2,.9,.3,1.1)}
.modal.wide{width:min(1180px,100%)}
.modal.narrow{width:min(520px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-head h2{font-size:19px}
.modal-head .x{margin-left:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal-foot .left{margin-right:auto}

/* toast + save state */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:999px;box-shadow:var(--sh2);z-index:90;font-size:13.5px;animation:pop .2s}
.saveState{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--green)}.dot.busy{background:var(--warn);animation:pulse 1s infinite}.dot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.meter{height:5px;border-radius:999px;background:var(--field);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.meter i.w{background:var(--warn)}.meter i.d{background:var(--danger)}

/* photos */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{border-radius:var(--rm);overflow:hidden;background:var(--surface-2);box-shadow:var(--sh1);position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.ph .cap{padding:7px 10px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.ph .del{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.92);color:var(--danger);border:0;border-radius:999px;width:24px;height:24px;cursor:pointer;display:grid;place-items:center;font-size:14px;box-shadow:var(--sh1);opacity:0;transition:opacity .15s}
.ph:hover .del{opacity:1}
.ph .tag{position:absolute;top:7px;left:7px}
.drop{border-radius:var(--rm);background:var(--surface-2);padding:18px;text-align:center;color:var(--ink-3);font-size:13px;cursor:pointer;transition:background .16s}
.drop:hover,.drop.over{background:var(--green-tint);color:var(--green-deep)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:20px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl .it:before{content:"";position:absolute;left:9px;top:16px;bottom:0;width:2px;background:var(--field)}
.tl .it:last-child:before{display:none}
.tl .bul{width:20px;height:20px;border-radius:50%;background:var(--green-tint);display:grid;place-items:center;font-size:10px;color:var(--green-deep);z-index:1}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* content board */
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--rm);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:90px}
.col h4{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between}
.ccard{background:var(--surface);border-radius:var(--rs);padding:11px 13px;box-shadow:var(--sh1);cursor:pointer;transition:transform .14s,box-shadow .16s}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.ccard .t{font-weight:500;font-size:13.5px;margin-bottom:3px}

/* documents */
.doc{background:#fff;color:#16211A;border-radius:var(--rm);box-shadow:var(--sh1);padding:34px 38px;font-size:12.5px;line-height:1.55}
.doc *{color:inherit}
.doc h2{font-family:var(--disp);font-size:20px;letter-spacing:.02em}
.doc .dhead{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px}
.doc .co{flex:1}
.doc .co b{font-family:var(--disp);font-size:15px;display:block}
.doc .meta{min-width:230px;font-size:12px}
.doc .meta div{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
.doc .party{background:#F4F6F3;border-radius:12px;padding:12px 15px;margin-bottom:16px}
.doc table{font-size:12px}
.doc th{background:#E2F0E7;color:#07642A;padding:7px 9px;font-size:11px;border-radius:0}
.doc thead tr th:first-child{border-radius:8px 0 0 8px}
.doc thead tr th:last-child{border-radius:0 8px 8px 0}
.doc td{padding:6px 9px}
.doc tbody tr{background:transparent}
.doc tbody tr:nth-child(even){background:#F7F9F6}
.doc tbody tr:hover{background:#F7F9F6}
.doc .sum{margin-left:auto;width:330px;font-size:12.5px}
.doc .sum div{display:flex;justify-content:space-between;padding:3px 0}
.doc .sum .tot{font-weight:600;font-size:15px;background:#E2F0E7;color:#07642A;padding:8px 12px;border-radius:10px;margin-top:6px;font-family:var(--disp)}
.doc .sign{display:flex;gap:40px;margin-top:34px}
.doc .sign div{flex:1;text-align:center;font-size:11.5px;color:#4C5C52}
.doc .sigline{margin:44px 12px 6px;height:1px;background:#C9D3CC}
.doc .grp{background:#F4F6F3;font-weight:600}

/* มุมมองลูกค้า (eye view) */
.eye-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;margin-top:14px}
.eye-card{position:relative;text-align:left;border:0;padding:0;background:var(--surface);border-radius:var(--rl);
  box-shadow:var(--sh1);cursor:pointer;overflow:hidden;transition:transform .16s,box-shadow .2s;font:inherit;color:inherit;display:block;width:100%}
.eye-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.eye-card:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.eye-img{background:linear-gradient(160deg,var(--green-soft),var(--surface-2));aspect-ratio:5/4;display:grid;place-items:center;overflow:hidden}
.eye-img img{width:100%;height:100%;object-fit:cover;display:block}
.eye-img svg{width:78%;height:78%}
.eye-body{padding:14px 16px 16px}
.eye-name{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.25}
.eye-sci{font-style:italic;font-size:12px;color:var(--ink-3);margin-top:1px}
.eye-warn{margin-top:9px;font-size:12px;color:var(--warn)}
.eye-code{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9);color:var(--green-deep);
  font-size:11px;padding:3px 9px;border-radius:999px;box-shadow:var(--sh1)}
:root[data-theme="dark"] .eye-code{background:rgba(20,28,23,.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eye-code{background:rgba(20,28,23,.9)}}

/* documents — template A (ใบเสนอราคาแบบสรุป) */
.doc{position:relative;overflow:hidden}
.doc .corner{position:absolute;top:0;right:0;width:0;height:0;border-top:66px solid #0B8636;border-left:66px solid transparent}
.doc .lab{color:#0B8636}
.doc .logo{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.doc .logo img{height:46px;width:auto}
.doc .logo .wm{font-family:var(--disp);font-weight:600;line-height:1.05;letter-spacing:.04em}
.doc .logo .wm span{display:block;font-size:7.5px;letter-spacing:.12em;color:#4C5C52;font-weight:400}
.doc .dt{font-family:var(--disp);font-size:22px;color:#0B8636;text-align:right;margin-bottom:10px}
.doc .metaG{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:11.5px}
.doc .metaG b{text-align:right;font-weight:500}
.doc .rule{height:1px;background:#D7DED9;margin:14px 0}
.doc .sumA{margin-left:auto;width:340px;font-size:11.5px}
.doc .sumA div{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0}
.doc .sumA .hi{color:#0B8636}
.doc .sigimg{height:44px;margin:0 auto -6px;display:block}

/* documents — template B (BOQ แบบตาราง) */
.doc2{background:#fff;color:#16211A;border-radius:var(--rm);box-shadow:var(--sh1);padding:22px 24px;font-size:11px;line-height:1.4}
.doc2 *{color:inherit}
.doc2 .logo{display:flex;gap:10px;align-items:center}
.doc2 .logo img{height:42px}
.doc2 .logo .wm{font-family:var(--disp);font-weight:600;line-height:1.05;letter-spacing:.04em}
.doc2 .logo .wm span{display:block;font-size:7.5px;letter-spacing:.12em;color:#4C5C52;font-weight:400}
.doc2 .hd{display:flex;gap:20px;align-items:flex-start;margin-bottom:10px}
.doc2 .co2{margin-left:auto;text-align:right;font-size:10.5px;line-height:1.5}
.doc2 .co2 b{font-family:var(--disp);font-size:12px}
.doc2 table{border-collapse:collapse;width:100%;font-size:10px;table-layout:fixed}
.doc2 th,.doc2 td{border:1px solid #97A69C;padding:3px 5px;background:transparent;border-radius:0;
  font-family:var(--sans);font-size:10px;letter-spacing:0;text-transform:none;font-weight:400;color:#16211A;
  overflow-wrap:anywhere}
.doc2 th{font-weight:600;text-align:center;background:#F1F4F0}
.doc2 tbody tr,.doc2 tbody tr:nth-child(even),.doc2 tbody tr:hover{background:transparent}
.doc2 td.r{text-align:right}.doc2 td.c{text-align:center}
.doc2 tr.grp td{font-weight:600;background:#F6F9F5}
.doc2 tr.tot td{font-weight:600;background:#F1F4F0}
.doc2 .infoT td{padding:4px 6px}
.doc2 .sign2{display:flex;gap:60px;margin-top:34px;justify-content:space-around}
.doc2 .sign2 div{text-align:center;font-size:10.5px;min-width:220px}
.doc2 .sigline2{border-bottom:1px dotted #6C7A70;margin:0 10px 5px;height:38px}
.doc2 .sigimg{height:40px;display:block;margin:0 auto -8px}

@media print{
  body{background:#fff}
  @page{size:A4 portrait;margin:12mm}
  @page land{size:A4 landscape;margin:9mm}
  .doc2{page:land}
  .side,.page-head,.no-print,.toast,.modal-head,.modal-foot{display:none!important}
  body.has-modal .shell{display:none!important}
  .shell{display:block}
  .main{padding:0;max-width:none}

function addPhotos(cid, kind) {

function shrink(file, max, q) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
        var cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, cv.width, cv.height);
        var out = cv.toDataURL('image/webp', q);
        if (out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', q);
        res(out);
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function addFileUpload(cid) {
  var inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
  inp.onchange = async function () {
    var c = cust(cid); ensureArr(c, 'files');
    var files = Array.from(inp.files || []), skipped = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (f.size > 1800000 && f.type.indexOf('image') !== 0) { skipped.push(f.name); continue; }
      var src;
      if (f.type.indexOf('image') === 0) src = await shrink(f, 1600, 0.75);
      else src = await new Promise(function (r) { var fr = new FileReader(); fr.onload = function () { r(fr.result); }; fr.readAsDataURL(f); });
      c.files.push({ id: uid('f'), name: f.name, kind: guessKind(f.name), jobId: '', date: todayISO(), size: src.length * 0.75, src: src });
    }
    save(); render();
    if (skipped.length) toast('ไฟล์ใหญ่เกิน 1.8 MB ' + skipped.length + ' ไฟล์ — ใช้แปะลิงก์แทน');
    else toast('อัปโหลดแล้ว');
  };
  inp.click();
}
function guessKind(name) {
  var s = name.toLowerCase();
  if (s.indexOf('สัญญา') >= 0 || s.indexOf('contract') >= 0) return 'สัญญา';
  if (s.indexOf('quot') >= 0 || s.indexOf('เสนอราคา') >= 0) return 'ใบเสนอราคา';
  if (s.indexOf('invoice') >= 0 || s.indexOf('แจ้งหนี้') >= 0) return 'ใบแจ้งหนี้';
  if (s.indexOf('tax') >= 0 || s.indexOf('กำกับ') >= 0) return 'ใบกำกับภาษี';
  return 'อื่น ๆ';
}

/* ===== เอกสาร: ใบเสนอราคา + BOQ / ใบแจ้งหนี้ / ใบวางบิล / ใบกำกับภาษี ===== */
function lineMat(l) { return Math.round(n(l.qty) * n(l.pm) * 100) / 100; }
function lineLab(l) { return Math.round(n(l.qty) * n(l.pl) * 100) / 100; }
function lineAmt(l) { return Math.round((lineMat(l) + lineLab(l)) * 100) / 100; }
function lineCost(l) { return Math.round((n(l.cm) + n(l.cl)) * n(l.qty) * 100) / 100; }
function isGroup(l) { return n(l.lvl) === 0; }

/* จัดบรรทัดเป็นหมวด → รายการ */
function groupsOf(d) {
  var gs = [], cur = null;
  (d.lines || []).forEach(function (l, i) {
    if (isGroup(l)) { cur = { line: l, idx: i, kids: [], mat: 0, lab: 0 }; gs.push(cur); return; }
    if (!cur) { cur = { line: null, idx: -1, kids: [], mat: 0, lab: 0 }; gs.push(cur); }
    cur.kids.push({ line: l, idx: i });
    cur.mat += lineMat(l); cur.lab += lineLab(l);
  });
  gs.forEach(function (g) { g.mat = Math.round(g.mat * 100) / 100; g.lab = Math.round(g.lab * 100) / 100; g.total = Math.round((g.mat + g.lab) * 100) / 100; });
  return gs;
}
function extraVal(e, sub) { return Math.round((e.mode === 'pct' ? sub * n(e.v) / 100 : n(e.v)) * 100) / 100; }
function calcDoc(d) {
  var mat = 0, lab = 0;
  (d.lines || []).forEach(function (l) { if (isGroup(l)) return; mat += lineMat(l); lab += lineLab(l); });
  mat = Math.round(mat * 100) / 100; lab = Math.round(lab * 100) / 100;
  var sub = Math.round((mat + lab) * 100) / 100;
  var add = 0, ded = 0, laborAdd = 0;
  (d.extras || []).forEach(function (e) {
    var v = extraVal(e, sub);
    if (e.kind === 'deduct') ded += v; else { add += v; if (e.labor) laborAdd += v; }
  });
  add = Math.round(add * 100) / 100; ded = Math.round(ded * 100) / 100;
  var base = Math.round((sub + add - ded) * 100) / 100;
  var vr = n(DB.settings.vat) / 100, preVat, vat;
  if (d.vatMode === 'in') { preVat = Math.round(base / (1 + vr) * 100) / 100; vat = Math.round((base - preVat) * 100) / 100; }
  else if (d.vatMode === 'ex') { preVat = base; vat = Math.round(base * vr * 100) / 100; }
  else { preVat = base; vat = 0; }
  var grand = Math.round((preVat + vat) * 100) / 100;
  var laborBase = Math.round((lab + laborAdd) * 100) / 100;
  var whtBase = d.whtMode === 'all' ? preVat : d.whtMode === 'labor' ? laborBase : 0;
  var wht = Math.round(whtBase * n(DB.settings.wht) / 100 * 100) / 100;
  var net = Math.round((grand - wht) * 100) / 100;
  var cost = 0; (d.lines || []).forEach(function (l) { if (!isGroup(l)) cost += lineCost(l); });
  return {
    mat: mat, lab: lab, sub: sub, add: add, ded: ded, base: base, preVat: preVat, vat: vat,
    grand: grand, laborBase: laborBase, wht: wht, net: net,
    cost: Math.round(cost * 100) / 100, profit: Math.round((sub - cost) * 100) / 100
  };
}

/* ---------- lines : ทุน → บวก % → ราคาเสนอ ---------- */
function lineCostU(l) { return Math.round((n(l.cm) + n(l.cl)) * 100) / 100; }
function lineSellU(l) { return Math.round((n(l.pm) + n(l.pl)) * 100) / 100; }
/* คิดราคาเสนอจากทุน + %กำไร โดยแบ่งวัสดุ/ค่าแรงตามสัดส่วนทุน */
function lineApplyMk(l) {
  var c = lineCostU(l);
  if (c <= 0) return;
  var k = 1 + n(l.mk) / 100;
  l.pm = Math.round(n(l.cm) * k * 100) / 100;
  l.pl = Math.round(n(l.cl) * k * 100) / 100;
}
/* ถ้าพิมพ์ราคาเองก็คำนวณ % ย้อนกลับให้ตรง */
function lineSyncMk(l) {
  var c = lineCostU(l);
  l.mk = c > 0 ? Math.round((lineSellU(l) / c - 1) * 1000) / 10 : 0;
}
/* สูตร %กำไรอัตโนมัติจากหมวดและจำนวน */
function ruleMk(cat, qty) {
  var rs = DB.settings.markupRules || [];
  for (var i = 0; i < rs.length; i++) {
    var r = rs[i];
    var catOK = !r.cats || !r.cats.length || r.cats.indexOf(cat) >= 0;
    var qmin = n(r.qmin), qmax = n(r.qmax);
    var qtyOK = (!qmin || n(qty) >= qmin) && (!qmax || n(qty) <= qmax);
    if (catOK && qtyOK) return { mk: n(r.mk), name: r.name };
  }
  return { mk: n(DB.settings.markup), name: 'ค่าเริ่มต้น' };
}

function lineSet(did, i, k, v, redraw) {
  var d = byId(DB.docs, did), l = d.lines[i];
  l[k] = (k === 'desc' || k === 'unit' || k === 'note') ? v : n(v);
  if (k === 'cm' || k === 'cl' || k === 'mk') { lineApplyMk(l); redraw = 1; }
  else if (k === 'pm' || k === 'pl') { lineSyncMk(l); }
  if (k === 'qty' || k === 'pm' || k === 'pl') { var c = document.getElementById('amt' + i); if (c) c.innerHTML = '<b>' + fmt(lineAmt(l)) + '</b>'; }
  save();

function applyRules(did) {
  var d = byId(DB.docs, did), cnt = 0, skipped = 0;
  d.lines.forEach(function (l) {
    if (isGroup(l)) return;
    if (lineCostU(l) <= 0) { skipped++; return; }
    l.mk = ruleMk(l.cat || '', l.qty).mk;
    lineApplyMk(l); cnt++;
  });
  save(); renderLines(did);
  toast('คิด % ให้ ' + cnt + ' บรรทัดแล้ว' + (skipped ? ' · ข้าม ' + skipped + ' บรรทัดที่ยังไม่ได้ใส่ทุน' : ''));

function viewDash() {

  var vatAmt = DB.docs.filter(function (d) { return d.type === 'TX' && (d.date || '').slice(0, 7) === mo && d.status !== 'void'; }).reduce(function (a, d) { return a + calcDoc(d).vat; }, 0);

  var h = head('ภาพรวม', 'ประจำวันที่ ' + thDate(today),

    + stat('ค้างรับ', fmt0(dueAmt) + ' ฿', due.length + ' ใบ' + (overdue.length ? ' · เลยกำหนด ' + overdue.length + ' ใบ' : ''), dueAmt > 0 ? 'accent' : '')

    + stat('ยอดขายเดือนนี้ (ก่อน VAT)', fmt0(salesAmt) + ' ฿', 'ภาษีขาย ' + fmt0(vatAmt) + ' บาท')
    + '</div>';

  h += '<div class="grid g2">';

  var todo = [];
  overdue.forEach(function (d) { todo.push(['d', 'เกินกำหนดชำระ ' + thDate(d.due), DOC_TYPES[d.type].name + ' ' + d.no + ' · ' + custName(d.customerId) + ' · ' + fmt0(calcDoc(d).net) + ' ฿', "docPreview('" + d.id + "')"]); });
  DB.docs.filter(function (d) { return d.type === 'QT' && d.status === 'sent' && d.due < today; }).forEach(function (d) {
    todo.push(['w', 'ใบเสนอราคาหมดอายุแล้ว', d.no + ' · ' + custName(d.customerId), "go('docs','" + d.id + "')"]);
  });
  DB.jobs.filter(function (j) { return j.status === 'ส่งมอบแล้ว' && !DB.docs.some(function (d) { return d.jobId === j.id && (d.type === 'IV' || d.type === 'TX'); }); }).forEach(function (j) {

  });
  DB.jobs.filter(function (j) { return j.status === 'นัดสำรวจ' || j.status === 'ติดต่อเข้ามา'; }).forEach(function (j) {
    todo.push(['', 'ยังไม่ได้เสนอราคา', j.title + ' · ' + custName(j.customerId), "go('customers','" + j.customerId + "')"]);
  });

    return '<div class="card tight spread" style="background:var(--surface-2);cursor:pointer" onclick="' + t[3] + '">'

  h += '</div>';

  h += soon.length ? '<div class="stack" style="gap:8px">' + soon.slice(0, 8).map(function (c) {
    return '<div class="card tight spread" style="background:var(--surface-2);cursor:pointer" onclick="go(\'content\')">'

  h += recent.length ? docsTable(recent) : '<div class="empty">ยังไม่มีเอกสาร</div>';
  return h + '</div>';

/* ---------- นำเข้า / ส่งออก ---------- */
var PLANT_PUBLIC_FIELDS = ['id', 'code', 'cat', 'name', 'alt', 'sci', 'form', 'size', 'layer', 'height_m', 'w_m', 'r_m',
  'light', 'water', 'care', 'care_note', 'colors', 'scent', 'bloom', 'warnings', 'flood_ok', 'tags', 'note', 'img'];
/* ส่งออกให้หน้าตาเหมือน data/plants.json เดิม — cat เป็น slug · alt เป็นข้อความคั่นจุลภาค */
function plantPublic(p) {
  var o = {};
  PLANT_PUBLIC_FIELDS.forEach(function (k) {
    var v = p[k];
    if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;
    if (k === 'id') { o.id = p.srcId || p.id; return; }
    if (k === 'cat') { o.cat = catSlug(p.cat); return; }
    if (k === 'alt') { o.alt = Array.isArray(v) ? v.join(', ') : v; return; }
    o[k] = v;
  });
  return o;
}
function plantExport() {
  var data = (DB.plants || []).map(plantPublic);
  /* กันราคาหลุดขึ้นเว็บ — ตัดทุกคีย์ที่เกี่ยวกับเงินทิ้งก่อนส่งออกเสมอ */
  var bad = /price|cost|mat|lab|markup|mk|ราคา|ทุน|กำไร/i, leaked = 0;
  data.forEach(function (o) { Object.keys(o).forEach(function (k) { if (bad.test(k)) { delete o[k]; leaked++; } }); });
  var json = JSON.stringify({ version: 2, updated: todayISO(), items: data }, null, 2);
  modal('ส่งออก plants.json',
    '<p style="margin-top:0">ไฟล์นี้คือข้อมูลที่ขึ้นเว็บแคตตาล็อกได้ <b>' + data.length + ' รายการ</b> '
    + (leaked ? '<span class="chip d">ตัดช่องราคาออก ' + leaked + ' ช่อง</span>' : '<span class="chip g">ไม่มีช่องราคาแม้แต่ช่องเดียว</span>') + '</p>'
    + '<div class="grid g4" style="margin:14px 0">' + PCATS.map(function (x) {
      return '<div class="stat"><div class="lbl">' + x.pre + ' ' + esc(x.name) + '</div><div class="val">' + data.filter(function (p) { return p.cat === x.name; }).length + '</div></div>';
    }).join('') + '</div>'
    + '<textarea id="expBox" style="min-height:220px;font-family:var(--mono);font-size:11.5px">' + esc(json) + '</textarea>'
    + '<p class="small muted">รูปแบบเดียวกับ <b>data/plants.json</b> เดิม (version · updated · items) หมวดเป็นรหัสเดิม sung · rua · tam · klum · hin เอาไปวางทับได้เลย</p>',
    '<button class="btn left ghost" onclick="copyText(document.getElementById(\'expBox\').value);toast(\'คัดลอกแล้ว\')">คัดลอกข้อความ</button>'
    + '<button class="btn" onclick="closeModal()">ปิด</button>'
    + '<button class="btn pri" onclick="saveFile(\'plants.json\',document.getElementById(\'expBox\').value,\'application/json\')">ดาวน์โหลดไฟล์</button>',
    { cls: 'wide', nofocus: true });
}

function plantImportFile() {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function () {

function normCat(c) {
  c = String(c || '').trim();
  for (var i = 0; i < PCATS.length; i++) if (PCATS[i].name === c || PCATS[i].slug === c) return PCATS[i].name;
  if (/สูง|ยืนต้น|ปาล์ม/.test(c)) return 'ไม้ระดับสูง';
  if (/รั้ว|พุ่มสูง|ไผ่|เลื้อย/.test(c)) return 'ไม้ริมรั้ว';
  if (/คลุมดิน|หญ้า/.test(c)) return 'ไม้คลุมดิน';
  if (/หิน|กรวด|ทราย|วัสดุ/.test(c)) return 'หิน';
  return 'ไม้ระดับต่ำ';
}
/* "10–15 ม." → 15 · "5–10 ซม." → 0.10 · คืน 0 ถ้าอ่านไม่ออก */
function parseSize(str) {
  var s = String(str || '');
  var m = s.match(/([\d.]+)\s*(?:[–\-]\s*([\d.]+))?\s*(ซม|cm|ม|m)/);
  if (!m) return 0;
  var v = n(m[2] || m[1]);
  return /ซม|cm/.test(m[3]) ? Math.round(v) / 100 : v;
}
function toArr(v) {
  if (Array.isArray(v)) return v.filter(Boolean);
  if (v == null || v === '') return [];
  return String(v).split(/[,·]/).map(function (s) { return s.trim(); }).filter(Boolean);
}
function plantImportRun() {
  var raw = document.getElementById('impBox').value.trim();
  var over = document.getElementById('impOver').checked;
  var arr;
  try {
    var j = JSON.parse(raw);
    arr = Array.isArray(j) ? j : (j.plants || j.data || j.items);
    if (!Array.isArray(arr)) throw 0;
  } catch (e) { toast('อ่านไฟล์ไม่ได้ — ต้องเป็น JSON ที่เป็น array ของพันธุ์ไม้'); return; }
  if (!Array.isArray(DB.plants)) DB.plants = [];
  var added = 0, updated = 0, skipped = 0, report = [];
  arr.forEach(function (r) {
    var name = String(r.name || r.ชื่อ || '').trim();
    if (!name) { skipped++; return; }
    var sci = String(r.sci || r.scientific || '').trim();
    var cat = normCat(r.cat || r.category);
    var hit = null;
    if (r.id) hit = (DB.plants || []).filter(function (p) { return p.srcId === String(r.id) || p.id === String(r.id) || p.code === String(r.id); })[0];
    if (!hit && sci) hit = (DB.plants || []).filter(function (p) { return p.sci && p.sci.toLowerCase() === sci.toLowerCase(); })[0];
    if (!hit) hit = (DB.plants || []).filter(function (p) { return p.name === name; })[0];
    if (hit && !over) { skipped++; return; }
    var p = hit || { id: uid('pl'), createdAt: todayISO(), cat: cat, code: '' };
    if (!hit) { p.cat = cat; p.code = nextPlantCode(cat); DB.plants.push(p); added++; }
    else { updated++; if (!p.code) p.code = nextPlantCode(p.cat || cat); }
    if (r.id != null) p.srcId = String(r.id);
    p.name = name;
    if (sci) p.sci = sci;
    if (r.cat || r.category) p.cat = cat;
    var alt = toArr(r.alt || r.alias);
    if (alt.length) p.alt = alt;
    if (r.form) p.form = r.form;
    if (r.layer) p.layer = r.layer;
    if (r.height_m != null) p.height_m = n(r.height_m);
    else if (r.size) p.height_m = parseSize(r.size);
    if (r.size) p.size = String(r.size);
    if (r.w_m != null || r.w != null) p.w_m = n(r.w_m != null ? r.w_m : r.w);
    if (r.r_m != null || r.r != null) p.r_m = n(r.r_m != null ? r.r_m : r.r);
    var lt = toArr(r.light); if (lt.length) p.light = lt;
    if (r.water) p.water = r.water;
    if (r.care) p.care = r.care;
    if (r.care_note) p.care_note = r.care_note;
    var col = toArr(r.colors); if (col.length) p.colors = col;
    if (r.scent) p.scent = r.scent;
    if (r.bloom) p.bloom = r.bloom;
    var tg = toArr(r.tags); if (tg.length) p.tags = tg;
    var wn = toArr(r.warnings); if (wn.length) p.warnings = wn;
    if (r.flood_ok != null) p.flood_ok = r.flood_ok === true ? 'yes' : r.flood_ok === false ? 'no' : String(r.flood_ok);
    if (r.note) p.note = r.note;
    if (r.img) p.img = r.img;
    p.updatedAt = todayISO();
    if (report.length < 6) report.push((hit ? 'อัปเดต' : 'เพิ่ม') + ' ' + p.code + ' ' + p.name);
  });
  closeModal(); save(); render();
  modal('นำเข้าเสร็จแล้ว',
    '<div class="grid g3" style="margin-bottom:14px">'
    + '<div class="stat accent"><div class="lbl">เพิ่มใหม่</div><div class="val">' + added + '</div></div>'
    + '<div class="stat"><div class="lbl">อัปเดตของเดิม</div><div class="val">' + updated + '</div></div>'
    + '<div class="stat"><div class="lbl">ข้าม</div><div class="val">' + skipped + '</div></div></div>'
    + (report.length ? '<div class="small muted">' + esc(report.join(' · ')) + (arr.length > 6 ? ' …' : '') + '</div>' : '')
    + '<p class="small" style="margin-top:12px">ขั้นถัดไป: ผูกรหัสเข้ากับของในคลัง แล้วส่งออก plants.json กลับไปให้เว็บ</p>',
    '<button class="btn" onclick="closeModal()">ปิด</button><button class="btn pri" onclick="closeModal();linkWizard()">ผูกรหัสกับคลังของ</button>', { cls: 'narrow', nofocus: true });

/* ---------- ผูกรหัสกับคลังของ ---------- */
function guessPlant(itemName) {
  var nm = String(itemName || '').toLowerCase();
  var best = null, bestLen = 0;
  (DB.plants || []).forEach(function (p) {
    [p.name].concat(p.alt || []).forEach(function (a) {
      var s = String(a || '').toLowerCase();
      if (s.length > 1 && nm.indexOf(s) >= 0 && s.length > bestLen) { best = p; bestLen = s.length; }
    });
  });
  return best;
}
function linkWizard() {
  var orphan = DB.items.filter(function (i) { return LINKABLE_CATS.indexOf(i.cat) >= 0 && !i.plantId; });
  if (!orphan.length) { toast('ของในคลังผูกรหัสครบแล้ว'); return; }
  if (!(DB.plants || []).length) { toast('ยังไม่มีพันธุ์ไม้ — นำเข้าจากแคตตาล็อกก่อน'); return; }
  var rows = orphan.map(function (i) {
    var g = guessPlant(i.name);
    return '<tr><td><b>' + esc(i.name) + '</b><div class="small muted">' + esc(i.cat) + ' · ' + esc(i.unit) + '</div></td>'
      + '<td><select id="lk_' + i.id + '"><option value="">— ไม่ผูก —</option>'
      + (DB.plants || []).map(function (p) {
        return '<option value="' + p.id + '"' + (g && g.id === p.id ? ' selected' : '') + '>' + esc(p.code) + ' · ' + esc(p.name) + '</option>';
      }).join('') + '</select></td>'

function seedPlants() {
  if (!Array.isArray(DB.plants)) DB.plants = [];
  if (DB.plants.length || DB.settings.plantsSeeded) return 0;
  DB.plants = JSON.parse(JSON.stringify(CATALOGUE_SEED));
  DB.settings.plantsSeeded = true;
  return DB.plants.length;
}

    tree: '<path ' + F + ' d="M60 ' + (30 + v * 4) + c(v) + '"/><path ' + S + ' d="M60 78V56M60 64l-9-8M60 68l9-7"/>',
    palm: '<path ' + S + ' d="M60 80V44"/><path ' + F + ' d="M60 44c-14-12-26-9-32-2 10-2 20 1 32 6zM60 44c14-12 26-9 32-2-10-2-20 1-32 6zM60 44c-6-16-2-26 6-30-2 10-2 20-6 32zM60 44c8-8 20-8 26-2-8 0-18 2-26 6z"/>',
    bamboo: '<path ' + S + ' d="M48 82V34M60 82V26M72 82V38M44 62h8M56 54h8M68 58h8M44 46h8M56 40h8"/><path ' + S + ' d="M48 34c-8-4-12-10-12-14M60 26c8-4 14-2 18 2M72 38c6-6 12-6 16-4"/>',
    hedge: '<rect ' + F + ' x="26" y="' + (40 + v * 3) + '" width="68" height="' + (40 - v * 3) + '" rx="10"/><path ' + S + ' d="M38 52v18M52 48v22M66 50v20M80 54v16"/>',
    shrub: '<path ' + F + ' d="M60 78c-20 0-30-10-30-22 0-13 12-22 30-22s30 9 30 22c0 12-10 22-30 22z"/><path ' + S + ' d="M60 78V50M60 58l-8-6M60 62l8-5"/>',
    clump: '<path ' + F + ' d="M40 80c-8-14-4-30 8-38 4 14 2 26-8 38zM60 80c-6-18 0-36 12-44 3 18-1 32-12 44zM80 80c-6-12-2-24 8-30 2 12-1 22-8 30z"/>',
    grass: '<path ' + S + ' d="M34 80c2-16 8-26 14-32M46 80c0-18 4-30 10-36M58 80c-2-20 2-32 8-38M70 80c-4-16 0-28 6-34M82 80c-4-12-2-22 2-28"/>',
    ground: '<path ' + F + ' d="M30 74c0-8 6-12 12-10 2-8 12-10 16-4 4-8 16-8 18 0 8-2 14 4 14 12 0 6-4 10-10 10H40c-6 0-10-4-10-8z"/><path ' + S + ' d="M44 66c2-4 6-6 10-6M66 62c4 0 8 2 10 6"/>',
    vine: '<path ' + S + ' d="M32 82c10-4 12-14 8-22-4-9 2-16 10-16s12 8 8 16c-4 9 0 18 10 22"/><path ' + F + ' d="M46 50c-6-2-10-8-8-12 6-2 12 2 12 8zM62 40c6-4 12-2 14 2-4 6-12 6-16 2z"/>',
    stone: '<path ' + F + ' d="M28 74c-2-10 6-20 16-22 6-10 22-12 28-4 12-2 22 6 22 16 0 8-6 14-16 14H40c-7 0-11-2-12-4z"/><path ' + S + ' d="M46 62c4-6 12-8 16-4"/>'
  };
  function c(k) {
    var w = 26 + k * 3;
    return 'c-' + w + ' 0-' + (w + 6) + ' 16-' + (w + 2) + ' 26 -6 10 4 22 ' + (w + 2) + ' 22s' + (w + 8) + '-12 ' + (w + 2) + '-22c4-10-2-26-' + (w + 2) + '-26z';
  }
  return '<svg viewBox="0 0 120 100" width="100%" height="100%" aria-hidden="true">' + g + (art[form] || art.shrub) + '</svg>';
}
function plantSeed(p) { var s = 0, k = String(p.id || p.code); for (var i = 0; i < k.length; i++) s += k.charCodeAt(i); return s; }

/* ---------- ตัวกรองแบบที่ลูกค้าเห็น ---------- */
function eyeFilters() {
  var f = state.eye || (state.eye = { cat: '', care: '', light: '', water: '', scent: '', color: '', tag: '', q: '' });
  var stone = f.cat === 'หิน';
  var row = function (label, key, list) {
    return '<div class="row" style="gap:8px;align-items:baseline"><span class="small muted" style="min-width:104px">' + label + '</span><div class="pill-row">'
      + '<button class="filt ' + (!f[key] ? 'on' : '') + '" onclick="eyeSet(\'' + key + '\',\'\')">ทั้งหมด</button>'
      + list.map(function (v) {
        return '<button class="filt ' + (f[key] === v ? 'on' : '') + '" onclick="eyeSet(\'' + key + '\',' + JSON.stringify(v).replace(/"/g, "'") + ')">' + esc(v) + '</button>';
      }).join('') + '</div></div>';
  };
  var h = '<div class="stack" style="gap:10px">'
    + row('หมวด', 'cat', PCATS.map(function (c) { return c.name; }));
  /* ความยากในการดูแลอยู่บนสุดตาม design direction */
  if (!stone) {
    h += row('ความยากในการดูแล', 'care', CARE)
      + row('แสง', 'light', LIGHT)
      + row('ความต้องการน้ำ', 'water', WATER)
      + row('กลิ่นดอก', 'scent', ['หอมแรง', 'หอมอ่อน', 'ไม่มีกลิ่น'])
      + row('สีดอก', 'color', FCOLORS.slice(0, 7));
  } else {
    h += row('การใช้งาน', 'tag', STONE_TAGS);
  }
  return h + '</div>';
}
function eyeSet(k, v) { state.eye[k] = v; render(); }
function eyeList() {
  var f = state.eye || {}, q = (f.q || '').toLowerCase();
  return (DB.plants || []).filter(function (p) {
    if (f.cat && p.cat !== f.cat) return false;
    if (f.care && p.care !== f.care) return false;
    if (f.light && (p.light || []).indexOf(f.light) < 0) return false;
    if (f.water && p.water !== f.water) return false;
    if (f.scent && p.scent !== f.scent) return false;
    if (f.color && (p.colors || []).indexOf(f.color) < 0) return false;
    if (f.tag && (p.tags || []).indexOf(f.tag) < 0) return false;
    if (q && ((p.name || '') + ' ' + (p.sci || '') + ' ' + (p.alt || []).join(' ') + ' ' + (p.note || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function eyeView() {
  var list = eyeList(), all = (DB.plants || []).length;
  var thin = list.filter(function (p) { return !p.note || (p.cat !== 'หิน' && (!p.care || !(p.light || []).length)); });
  var h = '<div class="card" style="margin-bottom:16px"><div class="spread" style="margin-bottom:12px">'
    + '<div><h3>ตัวกรองที่ลูกค้าเห็น</h3><div class="card-sub">ชุดเดียวกับหน้าแคตตาล็อก · ความยากในการดูแลอยู่บนสุดตาม design direction</div></div>'
    + '<div class="search" style="max-width:280px"><span class="mg">⌕</span><input type="text" placeholder="ค้นหาแบบลูกค้า" value="' + esc((state.eye || {}).q || '') + '" oninput="state.eye.q=this.value;render()"></div>'
    + '</div>' + eyeFilters() + '</div>';

  h += '<div class="card"><div class="spread" style="margin-bottom:6px">'
    + '<div><h3>' + list.length + ' รายการ</h3><div class="card-sub">จาก ' + all + ' รายการทั้งหมด · กดการ์ดเพื่อดูหน้ารายละเอียดแบบลูกค้า</div></div>'
    + '<span class="chip g">ไม่มีราคาในมุมมองนี้</span></div>';
  if (thin.length) h += '<div class="card tight" style="background:var(--warn-tint);color:var(--warn);margin:12px 0">'
    + '<b>' + thin.length + ' รายการที่แสดงอยู่ยังไม่มีคำอธิบายหรือข้อมูลดูแลครบ</b>'
    + '<div class="small">ลูกค้าจะเห็นการ์ดที่ว่าง ๆ — ' + esc(thin.slice(0, 4).map(function (p) { return p.code + ' ' + p.name; }).join(' · ')) + (thin.length > 4 ? ' …' : '') + '</div></div>';

  if (!list.length) return h + '<div class="empty">ไม่มีรายการในตัวกรองนี้ — ลูกค้าจะเห็นหน้าว่างเหมือนกัน</div></div>';
  h += '<div class="eye-grid">' + list.map(eyeCard).join('') + '</div></div>';
  return h;
}
function eyeCard(p) {
  var pc = pcat(p.cat), s = plantSeed(p);
  return '<button class="eye-card" onclick="eyeDetail(\'' + p.id + '\')">'
    + '<div class="eye-img">' + (p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.name) + '">' : formArt(p.form, s)) + '</div>'
    + '<div class="eye-body">'
    + '<div class="eye-name">' + esc(p.name) + '</div>'
    + (p.sci ? '<div class="eye-sci">' + esc(p.sci) + '</div>' : '<div class="eye-sci muted">ยังไม่มีชื่อวิทยาศาสตร์</div>')
    + '<div class="pill-row" style="margin-top:8px">'
    + (p.size ? '<span class="chip">' + esc(p.size) + '</span>' : '')
    + (p.care ? '<span class="chip g">ดูแล' + esc(p.care) + '</span>' : '')
    + ((p.light || []).length ? '<span class="chip i">' + esc(p.light.join(' · ')) + '</span>' : '')
    + ((p.tags || []).length ? '<span class="chip b">' + esc(p.tags.join(' · ')) + '</span>' : '')
    + '</div>'
    + ((p.warnings || []).length ? '<div class="eye-warn">⚠ ' + esc(p.warnings.join(' · ')) + '</div>' : '')
    + '</div><span class="eye-code num">' + esc(p.code) + '</span></button>';
}
function eyeDetail(id) {
  var p = plant(id), s = plantSeed(p);
  var line = function (l, v) { return v ? '<div class="row" style="gap:10px;align-items:baseline"><span class="small muted" style="min-width:120px">' + l + '</span><span>' + v + '</span></div>' : ''; };
  var b = '<div class="grid g2" style="align-items:start">'
    + '<div class="eye-img" style="border-radius:20px;aspect-ratio:4/3">' + (p.img ? '<img src="' + esc(p.img) + '" alt="">' : formArt(p.form, s)) + '</div>'
    + '<div>'
    + '<div class="chip b" style="margin-bottom:8px">จากหน้างานจริง</div>'
    + '<h2 style="font-size:24px;margin-bottom:2px">' + esc(p.name) + '</h2>'
    + '<div style="font-style:italic;color:var(--ink-3);margin-bottom:14px">' + esc(p.sci || '—') + '</div>'
    + (p.note ? '<p style="margin:0 0 14px;line-height:1.7">' + esc(p.note) + '</p>' : '<p class="muted" style="margin:0 0 14px">ยังไม่มีคำอธิบาย — ลูกค้าจะเห็นช่องว่างตรงนี้</p>')
    + '<div class="stack" style="gap:6px">'
    + line('หมวด', esc(p.cat))
    + line('ขนาดเมื่อโตเต็มที่', esc(p.size))
    + line('แสง', esc((p.light || []).join(' · ')))
    + line('ความต้องการน้ำ', esc(p.water))
    + line('ความยากในการดูแล', esc(p.care))
    + line('การดูแล', esc(p.care_note))
    + line('สีดอก', esc((p.colors || []).join(' · ')))
    + line('กลิ่นดอก', esc(p.scent))
    + line('ช่วงออกดอก', esc(p.bloom))
    + line('การใช้งาน', esc((p.tags || []).join(' · ')))
    + line('ทนน้ำท่วมขัง', p.flood_ok === 'yes' ? 'ทนได้' : p.flood_ok === 'no' ? 'ไม่ทน' : '')
    + '</div>'
    + ((p.alt || []).length ? '<div class="small muted" style="margin-top:12px">เรียกอีกชื่อว่า ' + esc(p.alt.join(' · ')) + '</div>' : '')
    + ((p.warnings || []).length ? '<div class="card tight" style="background:var(--warn-tint);color:var(--warn);margin-top:14px"><b>ข้อควรระวัง</b><div class="small">' + esc(p.warnings.join(' · ')) + '</div></div>' : '')
    + '<div class="card tight" style="background:var(--green-tint);color:var(--green-deep);margin-top:14px">ปรึกษาต้นนี้กับ Always Trees<div class="small">ปุ่มนี้บนเว็บจริงจะลิงก์ไป LINE OA</div></div>'
    + '</div></div>';
  modal(p.code + ' · มุมมองลูกค้า', b,
    '<button class="btn left ghost" onclick="closeModal();plantEdit(\'' + p.id + '\')">แก้ข้อมูลนี้</button>'
    + '<button class="btn" onclick="closeModal()">ปิด</button>', { cls: 'wide', nofocus: true });
}
/* ---------- boot ---------- */
(function boot() {
  loadDB();
  var ui = loadUI();
  state = { tab: ui.tab || 'dash', arg: ui.arg || null, sub: ui.sub || 'overview', plView: ui.plView || 'table', saveKind: 'ok', saveMsg: 'บันทึกแล้ว', pickSel: {}, eye: { cat: '', care: '', light: '', water: '', scent: '', color: '', tag: '', q: '' } };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen) closeModal();
    if (e.key === 'p' && (e.metaKey || e.ctrlKey) && modalOpen) { /* let print through */ }
  });
  window.addEventListener('beforeunload', function () { try { localStorage.setItem('at_backup', JSON.stringify({ t: Date.now(), db: DB })); } catch (e) { } });
  var seeded = seedPlants();
  if (seeded) save();
  render();
  ns().then(function (a) {
    if (a === false) setSave('err', 'ต่อเซิร์ฟเวอร์ไม่ได้ — แก้ได้แต่ยังไม่ถูกบันทึกถาวร');
    else setSave('ok', 'บันทึกอัตโนมัติขึ้นเซิร์ฟเวอร์');
  });
})();
</script>
