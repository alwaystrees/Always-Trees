  --sand-size:9px 9px,13px 13px;
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 4px 12px -6px rgba(0,0,0,.6);
    --sh-2:0 2px 5px rgba(0,0,0,.5),0 16px 32px -16px rgba(0,0,0,.8);
    --sh-3:0 6px 12px rgba(0,0,0,.55),0 34px 64px -22px rgba(0,0,0,.9);
  }
}

  --paper:#0E1411; --surface:#171E1A; --tint:#232520; --tint-2:#2D2F28;
  --ink:#E9EFE8; --ink-2:#C2CCC4; --muted:#949A8E;
  --accent:#3FC46B; --accent-2:#55D780; --accent-ink:#71DC96; --accent-soft:#12291B; --on-accent:#04180B;
  --clay:#CD9A70; --clay-ink:#DFB68F; --clay-soft:#2B2119; --on-clay:#1A120B;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-weight:400; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.logomark{display:block;background-color:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

/* ======================= 1 · COVER ======================= */
.cover{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:38px;padding:56px 20px 64px;background:var(--paper);
  transition:opacity .55s ease,transform .55s ease;
}
.cover.leaving{opacity:0;transform:translateY(-14px);pointer-events:none}
.cover-stage{position:relative;perspective:1600px;perspective-origin:50% 45%}
.ground-shadow{
  position:absolute;left:50%;bottom:-30px;width:66%;height:30px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(18,46,30,.30),rgba(18,46,30,0) 70%);filter:blur(7px);
  transform:translateX(-50%);animation:shadowPulse 7s ease-in-out 1s infinite,riseIn .9s .2s ease both;pointer-events:none;
}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(1) scaleY(1);opacity:.95}50%{transform:translateX(-50%) scaleX(.86) scaleY(.7);opacity:.5}}
.book{
  width:min(360px,74vw);aspect-ratio:3/4;border-radius:4px 12px 12px 4px;
  background:linear-gradient(158deg,var(--cover-a),var(--cover-b));
  box-shadow:var(--sh-3);position:relative;cursor:pointer;
  transform-style:preserve-3d;transform-origin:left center;
  animation:bookIn 1s cubic-bezier(.2,.8,.25,1) both, bookFloat 7s ease-in-out 1s infinite;
  transition:box-shadow .4s ease;
}
.book::before{content:"";position:absolute;inset:0 auto 0 0;width:20px;border-radius:4px 0 0 4px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,.06) 62%,rgba(255,255,255,.10))}
.book::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 42%)}
.book:hover{box-shadow:0 10px 18px rgba(20,40,28,.12),0 48px 80px -24px rgba(20,40,28,.45)}
.book.open{animation:none;transform:rotateY(-108deg);opacity:.15;transition:transform .75s cubic-bezier(.7,0,.3,1),opacity .75s ease}
@keyframes bookIn{from{opacity:0;transform:translateY(26px) rotateY(18deg) scale(.94)}to{opacity:1;transform:translateY(0) rotateY(0) scale(1)}}
@keyframes bookFloat{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-11px) rotateY(-2.5deg)}}
.book-face{position:absolute;inset:0;padding:38px 32px 30px 46px;display:flex;flex-direction:column;color:#F2F6F0}
.bk-eyebrow{font-size:10px;letter-spacing:.28em;font-weight:600;color:var(--gold);text-transform:uppercase}
.bk-title{font-family:var(--f-display);font-weight:600;font-size:clamp(25px,5.6vw,33px);line-height:1.28;margin:16px 0 0;letter-spacing:-.01em}
.bk-rule{display:block;width:46px;height:2px;background:var(--gold);margin:18px 0 14px;opacity:.9}
.bk-sub{margin:0;font-family:var(--f-display);font-size:14px;line-height:1.7;color:rgba(243,247,240,.86)}
.bk-mark{margin:auto auto 12px;width:44%;height:33%;color:var(--gold);opacity:.95}
.bk-foot{font-size:10.5px;letter-spacing:.18em;color:rgba(239,223,180,.78);font-weight:600;font-variant-numeric:tabular-nums}
.cover-actions{display:flex;flex-direction:column;align-items:center;gap:14px;animation:riseIn .9s .35s cubic-bezier(.2,.8,.25,1) both}
.cover-hint{font-size:12.5px;color:var(--muted)}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ======================= BUTTONS ======================= */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);
  background:var(--tint);cursor:pointer;font-weight:500;font-size:14px;color:var(--ink-2);
  transition:background .16s,box-shadow .2s,transform .2s,color .16s;
}
.btn:hover{background:var(--tint-2);box-shadow:var(--sh-1)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);box-shadow:0 2px 4px rgba(20,60,40,.16),0 12px 24px -10px rgba(20,60,40,.5)}
.btn.clay{background:var(--clay-soft);color:var(--clay-ink)}
.btn.clay:hover{background:var(--clay-soft);box-shadow:var(--sh-1)}
.btn.lg{padding:13px 32px;font-size:15.5px;border-radius:12px;font-weight:600}
.btn.ghost{background:transparent;padding:8px 10px}
.btn.ghost:hover{background:var(--tint)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

/* ======================= HEADER ======================= */
.top{position:sticky;top:0;z-index:40;background:var(--paper);box-shadow:0 6px 18px -16px rgba(20,40,28,.6)}
.top-in{display:flex;align-items:center;gap:14px;padding:13px 20px;max-width:1240px;margin:0 auto;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--tint);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2);flex:none;transition:background .16s,box-shadow .2s,transform .2s}
.back:hover{background:var(--tint-2);box-shadow:var(--sh-1);transform:translateX(-2px)}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;cursor:pointer;text-align:left;padding:2px 4px;border-radius:8px;transition:opacity .15s}
.brandmark{width:24px;height:38px;color:var(--accent);flex:none}
.brandtext{display:flex;flex-direction:column;gap:1px}
.brand .bname{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.brand:hover{opacity:.68}
.brand .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.search{position:relative;flex:1 1 200px;max-width:300px}
.search input{width:100%;padding:10px 12px 10px 34px;border-radius:var(--r-sm);background:var(--tint)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;box-shadow:var(--ring)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}

/* ======================= 2 · CATEGORIES ======================= */
.cats-hero{
  position:relative;text-align:center;padding:48px 26px 58px;margin-top:14px;
  border-radius:30px 30px 54% 54% / 30px 30px 17% 17%;
  background:linear-gradient(178deg,var(--accent-soft) 0%,var(--hero-fade) 100%);
  animation:riseIn .6s ease both;
}
.cats-hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:var(--sand);background-size:var(--sand-size);opacity:.42}
.cats-hero>*{position:relative;z-index:1}
.hero-mark{width:38px;height:60px;color:var(--accent);margin:0 auto 16px}
.hero-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.hero-stats span{padding:6px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hero-stats b{color:var(--accent-ink);font-weight:600}
.cats-hero h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(25px,3.4vw,33px);letter-spacing:-.01em}
.cats-hero p{margin:12px auto 0;max-width:50ch;color:var(--muted);font-size:14.5px}
.cats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:14px 0 76px;max-width:1000px;margin:0 auto}
@media (max-width:940px){.cats-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.cats-grid{grid-template-columns:1fr}}
.catcard{
  padding:26px 24px 22px;border-radius:26px;background:var(--surface);box-shadow:var(--sh-1);
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:11px;position:relative;
  transition:box-shadow .38s ease,transform .38s cubic-bezier(.2,.8,.25,1),background .3s;animation:riseIn .7s cubic-bezier(.2,.8,.25,1) both;
}
.catcard:hover{box-shadow:var(--sh-2);transform:translateY(-6px);background:linear-gradient(180deg,var(--accent-soft) 0%,var(--surface) 46%)}
.catcard[data-cat="hin"]:hover{background:linear-gradient(180deg,var(--clay-soft) 0%,var(--surface) 46%)}
.catcard .glyphwrap{width:64px;height:64px;border-radius:var(--pebble);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:background .26s,color .26s,transform .3s}
.catcard:hover .glyphwrap{background:var(--accent);color:#fff;transform:rotate(-5deg) scale(1.06)}
.catcard[data-cat="hin"] .glyphwrap{background:var(--clay-soft);color:var(--clay)}
.catcard[data-cat="hin"]:hover .glyphwrap{background:var(--clay);color:#fff}
.catcard .glyph{width:38px;height:38px;display:block}
.catcard .eg{margin:0;font-size:12px;color:var(--muted);opacity:.85;line-height:1.55}
.catcard h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.25}
.catcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.65;flex:1}
.catcard .go{display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.catcard .go svg{transition:transform .24s}
.catcard:hover .go svg{transform:translateX(4px)}
.catcard[data-cat="hin"] .glyph,.catcard[data-cat="hin"] .go{color:var(--clay)}

/* ======================= 3 · LIST ======================= */
.catbar{display:flex;gap:7px;flex-wrap:wrap;padding:20px 0 2px}
.catpill{padding:7px 14px;border-radius:999px;background:var(--tint);font-size:13.5px;cursor:pointer;color:var(--ink-2);transition:background .16s,box-shadow .2s,color .16s}
.catpill:hover{background:var(--tint-2);box-shadow:var(--sh-1)}
.catpill[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.catpill[data-cat="hin"][aria-current="true"]{background:var(--clay);color:var(--on-clay)}
.list-head{display:flex;align-items:center;gap:16px;padding:22px 0 4px;animation:riseIn .45s ease both}
.lh-glyph{flex:none;width:60px;height:60px;border-radius:var(--pebble);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.lh-glyph.stone{background:var(--clay-soft);color:var(--clay)}
.lh-glyph .glyph{width:34px;height:34px;display:block}
.list-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(23px,3vw,29px);letter-spacing:-.01em}
.list-head p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:56ch}

.main{display:grid;grid-template-columns:230px 1fr;gap:30px;padding:22px 0 70px;align-items:start}
.rail{position:sticky;top:80px;display:flex;flex-direction:column;gap:20px}
.rail-body{display:flex;flex-direction:column;gap:20px}
.fgroup h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;background:var(--tint);cursor:pointer;font-size:13px;line-height:1.4;color:var(--ink-2);transition:background .16s,box-shadow .2s,color .16s}
.chip:hover{background:var(--tint-2);box-shadow:var(--sh-1)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip.swatch{display:inline-flex;align-items:center;gap:6px;padding-left:8px}
.chip.swatch i{width:11px;height:11px;border-radius:3px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.results-bar{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.results-bar .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{padding:0;color:var(--accent-ink);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;background:none}

/* ======================= CARDS ======================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{border-radius:20px;background:var(--surface);box-shadow:var(--sh-1);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;position:relative;transition:box-shadow .24s,transform .24s}
.card:hover{box-shadow:var(--sh-2);transform:translateY(-3px)}
.thumb{aspect-ratio:3/2;background:linear-gradient(168deg,var(--thumb-a),var(--thumb-b));display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.card[data-cat="hin"] .thumb,.thumb.stone{background:linear-gradient(168deg,var(--stone-a),var(--stone-b))}
.thumb::after{content:"";position:absolute;inset:0;background:var(--sand);background-size:var(--sand-size);opacity:.45;pointer-events:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.thumb svg{width:78%;height:88%;color:var(--accent);opacity:.62}
.card[data-cat="hin"] .thumb svg,.thumb.stone svg{color:var(--clay)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25}
.sci{font-family:var(--f-sci);font-style:italic;font-size:12.5px;color:var(--muted);line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--tint);color:var(--ink-2);white-space:nowrap}
.tag.scent{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.card[data-cat="hin"] .tag{background:var(--clay-soft);color:var(--clay-ink)}
.dots{display:flex;gap:3px;align-items:center;margin-top:auto;padding-top:6px}
.dots i{width:9px;height:9px;border-radius:999px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.size-line{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:54px 20px 58px;text-align:center;color:var(--muted);background:var(--tint);border-radius:var(--r)}
.empty-mark{width:26px;height:41px;color:var(--accent);opacity:.35;margin:0 auto 14px}

/* edit affordances */
.card .rowbtns{position:absolute;top:9px;right:9px;display:none;gap:6px;z-index:2}
body.editing .card .rowbtns{display:flex}
.iconbtn{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;cursor:pointer;background:var(--surface);box-shadow:var(--sh-1);color:var(--ink-2)}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent-ink)}
.iconbtn.danger:hover{background:var(--clay-soft);color:var(--clay)}
.addcard{border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);cursor:pointer;display:none;align-items:center;justify-content:center;min-height:160px;font-weight:600;transition:box-shadow .2s,transform .2s}
body.editing .addcard{display:flex}
.addcard:hover{box-shadow:var(--sh-2);transform:translateY(-3px)}
.editbar{display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 15px;margin:0 0 18px;border-radius:var(--r);background:var(--accent-soft);box-shadow:var(--sh-1)}
body.editing .editbar{display:flex}
.editbar .note{font-size:13px;color:var(--accent-ink);margin-right:auto}
.editbar .btn{background:var(--surface)}
.editbar .btn.primary{background:var(--accent)}
.dirty-dot{width:7px;height:7px;border-radius:999px;background:var(--clay);display:none;flex:none}
body.dirty .dirty-dot{display:block}

/* ======================= DIALOGS ======================= */
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:0;max-width:min(680px,94vw);width:100%;box-shadow:var(--sh-3)}
dialog::backdrop{background:rgba(12,24,17,.42);backdrop-filter:blur(2px)}
dialog[open]{animation:dlgIn .28s cubic-bezier(.2,.8,.25,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.dlg-head{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 16px}
.dlg-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.15}
.dlg-body{padding:2px 24px 22px;max-height:min(70vh,620px);overflow-y:auto}
.dlg-foot{display:flex;gap:9px;justify-content:flex-end;padding:15px 24px;background:var(--tint);flex-wrap:wrap}
.dlg-foot .btn{background:var(--surface)}
.dlg-foot .btn.primary{background:var(--accent)}
.hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:18px;display:block}
.spec{display:grid;grid-template-columns:104px 1fr;gap:9px 16px;margin:0 0 18px}
.spec dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.spec dd{margin:0}
.prose{font-size:14.5px;line-height:1.78;color:var(--ink-2);max-width:60ch}
.note-lb{margin:0 0 7px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:8px}
.note-lb::after{content:"";flex:1;height:1px;background:var(--tint-2)}
.cat-badge{font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.cat-badge.stone{background:var(--clay-soft);color:var(--clay-ink)}
.field{margin-bottom:15px}
.field label.lb{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input[type=text],.field select,.field textarea{width:100%;padding:9px 12px;border-radius:var(--r-sm);background:var(--tint)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;box-shadow:var(--ring)}
.field textarea{min-height:80px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.optset{display:flex;flex-wrap:wrap;gap:6px}
.optset label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;background:var(--tint);color:var(--ink-2)}
.optset input{margin:0;accent-color:var(--accent)}
.optset label:has(input:checked){background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.plant-only.hide{display:none}
.stone-only{display:none}
.stone-only.show{display:block}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;box-shadow:var(--sh-2)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}

.filters-toggle{display:none}
.sheet-only{display:none}
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,22,15,.4);z-index:55;display:none}
.sheet-backdrop.on{display:block;animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(102%)}to{transform:none}}
@media (max-width:900px){
  .main{grid-template-columns:1fr;gap:18px}
  .rail{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;display:none;gap:0;
    max-height:78dvh;border-radius:24px 24px 0 0;background:var(--surface);
    box-shadow:0 -8px 40px -10px rgba(12,30,18,.45);
  }
  .rail.open{display:flex}
  .rail.open{animation:sheetUp .32s cubic-bezier(.2,.85,.3,1) both}
  .rail-body{overflow-y:auto;padding:4px 20px 8px;gap:22px;-webkit-overflow-scrolling:touch}
  .sheet-only{display:flex}
  .sheet-head{align-items:center;justify-content:space-between;padding:16px 20px 10px;flex:none}
  .sheet-head::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:999px;background:var(--tint-2)}
  .sheet-title{font-family:var(--f-display);font-weight:600;font-size:18px}
  .sheet-foot{gap:9px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));flex:none;background:var(--surface);box-shadow:0 -8px 18px -14px rgba(12,30,18,.6)}
  .sheet-foot .btn{flex:1;justify-content:center}
  .filters-toggle{display:inline-flex}
}
@media (max-width:640px){
  .top-in{gap:9px}
  .brand{flex:1 1 auto;margin-right:0}
  .brand h1{font-size:17px}
  .search{order:5;flex:1 1 62%;max-width:none}
  .filters-toggle{order:6}
  .btn{padding:9px 12px}
  .cats-hero{padding:32px 0 0}
}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .two{grid-template-columns:1fr}
  .spec{grid-template-columns:88px 1fr}
  .cover{gap:28px;padding:40px 18px 48px}
  .cats-grid{gap:14px;padding:24px 0 56px}
  .catcard{padding:20px 18px 18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .book.open{opacity:0}
}

/* รหัสพันธุ์ไม้ + กล่องข้อควรระวัง (เพิ่มตอนเชื่อมกับหลังบ้าน) */
.pcode{font-family:var(--f-mono,ui-monospace,monospace);font-size:10.5px;font-weight:600;
  letter-spacing:.1em;color:var(--accent-ink);opacity:.85;margin-bottom:2px}
#d-code{font-family:var(--f-mono,ui-monospace,monospace);font-size:11.5px;font-weight:600;
  letter-spacing:.1em;color:var(--accent-ink);opacity:.9;display:block;margin-bottom:3px}
#d-code[hidden]{display:none}
.warnbox{margin-top:18px;padding:15px 18px;border-radius:14px;background:rgba(179,69,42,.09)}
.warn-lb{margin:0 0 8px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;color:#B3452A}
.warnbox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.warnbox li{font-size:14px;line-height:1.65;color:var(--ink-2)}
@media (prefers-color-scheme:dark){.warnbox{background:rgba(224,129,99,.14)}.warn-lb{color:#E08163}}
</style>

</head>
<body>
<!-- ============ 1 · COVER ============ -->
<section class="cover" id="cover">
  <div class="cover-stage">
    <div class="book" id="book" role="button" tabindex="0" aria-label="เปิดแคตตาล็อก">
      <div class="book-face">
        <span class="bk-eyebrow">Always Trees</span>
        <h1 class="bk-title">แคตตาล็อก<br>ต้นไม้และ<br>วัสดุจัดสวน</h1>
        <span class="bk-rule"></span>
        <p class="bk-sub" id="bk-sub"></p>
        <span class="logomark bk-mark" aria-hidden="true"></span>
        <span class="bk-foot" id="bk-foot"></span>
      </div>
    </div>
    <span class="ground-shadow"></span>
  </div>
  <div class="cover-actions">
    <button class="btn primary lg" id="opencover">เปิดแคตตาล็อก</button>
    <span class="cover-hint">ต้นไม้ที่เราปลูกและดูแลจริงหน้างาน — แตะที่ปกเพื่อเปิด</span>
  </div>
</section>

<!-- ============ SHELL (2 + 3) ============ -->
<div id="shell" hidden>
  <header class="top">
    <div class="top-in">
      <button class="back" id="backbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backlabel">หน้าปก</span></button>
      <button class="brand" id="brand">
        <span class="logomark brandmark" aria-hidden="true"></span>
        <span class="brandtext">
          <span class="eyebrow">Always Trees</span>
          <span class="bname">แคตตาล็อกต้นไม้และวัสดุจัดสวน</span>
        </span>
      </button>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" type="text" placeholder="ค้นหาชื่อไทย / ชื่อวิทย์" autocomplete="off">
      </div>
      <button class="btn filters-toggle" id="ftoggle" aria-pressed="false" hidden>ตัวกรอง</button>
      <button class="btn ghost" id="themebtn" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn clay" id="editbtn" aria-pressed="false" hidden>แก้ไข</button>
    </div>
  </header>

  <div class="wrap">
    <!-- ============ 2 · CATEGORIES ============ -->
    <section id="catsview">
      <div class="cats-hero">
        <span class="logomark hero-mark" aria-hidden="true"></span>
        <h2>เลือกหมวดที่ต้องการ</h2>
        <p id="catshero-sub"></p>
        <div class="hero-stats" id="herostats"></div>
      </div>
      <div class="cats-grid" id="catsgrid"></div>
    </section>

    <!-- ============ 3 · PLANTS IN CATEGORY ============ -->
    <section id="listview" hidden>
      <div class="catbar" id="catbar"></div>
      <div class="list-head">
        <span class="glyphwrap lh-glyph" id="lh-glyph"></span>
        <div>
          <h2 id="list-title"></h2>
          <p id="list-sub"></p>
        </div>
      </div>
      <div class="main">
        <aside class="rail" id="rail"></aside>
        <section>

    var c=$("#cover"); c.hidden=false; c.classList.remove("leaving");
    $("#book").classList.remove("open");

    return;
  }
  $("#cover").hidden=true;
  $("#shell").hidden=false;
  $("#catsview").hidden = v!=="cats";
  $("#listview").hidden = v!=="list";

}

/* ---------------- 3 · list ---------------- */
function matches(it){
  if(F.cat && it.cat!==F.cat) return false;
  if(F.q){
    var hay=(it.name+" "+(it.alt||"")+" "+(it.sci||"")+" "+(it.note||"")).toLowerCase();
    if(hay.indexOf(F.q)===-1) return false;
  }
  if(it.cat==="hin"){
    if(F.tags.length && !F.tags.some(function(t){return (it.tags||[]).indexOf(t)>-1;})) return false;
    if(F.colors.length && !F.colors.some(function(c){return (it.colors||[]).indexOf(c)>-1;})) return false;
    if(F.light.length||F.water.length||F.care.length||F.scent.length) return false;
    return true;
  }
  if(F.light.length && !F.light.some(function(l){return (it.light||[]).indexOf(l)>-1;})) return false;
  if(F.water.length && F.water.indexOf(it.water)===-1) return false;
  if(F.care.length && F.care.indexOf(it.care)===-1) return false;
  if(F.scent.length && F.scent.indexOf(it.scent)===-1) return false;
  if(F.colors.length && !F.colors.some(function(c){return (it.colors||[]).indexOf(c)>-1;})) return false;
  return true;
}
function filterCount(){return F.light.length+F.water.length+F.care.length+F.colors.length+F.scent.length+F.tags.length;}

function renderCatbar(){
  var html=CATS.map(function(c){
    return '<button class="catpill" data-cat="'+c.k+'" aria-current="'+(F.cat===c.k)+'">'+esc(c.name)+"</button>";
  }).join("");
  html+='<button class="catpill" data-cat="" aria-current="'+(F.cat===null)+'">ทั้งหมด</button>';
  var bar=$("#catbar"); bar.innerHTML=html;
  Array.prototype.forEach.call(bar.children,function(b){
    b.addEventListener("click",function(){ goList(b.dataset.cat||null); });
  });
}
function chipRow(title,list,key,swatch){
  var html='<div class="fgroup"><h3>'+esc(title)+'</h3><div class="chips">';
  html+=list.map(function(v){
    var on=F[key].indexOf(v)>-1;
    var sw = swatch ? '<i style="background:'+(COLORMAP[v]||"#999")+'"></i>' : "";
    return '<button class="chip'+(swatch?" swatch":"")+'" data-k="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+on+'">'+sw+esc(v)+'</button>';
  }).join("");
  return html+"</div></div>";
}

function cardHtml(it){
  var thumb = it.img
    ? '<img src="'+esc(it.img)+'" alt="'+esc(it.name)+'" loading="lazy">'
    : sil(it.form,it.id);
  var tags=[];
  if(it.cat==="hin"){
    (it.tags||[]).slice(0,2).forEach(function(t){tags.push('<span class="tag">'+esc(t)+'</span>');});
  }else{
    if(it.light&&it.light[0]) tags.push('<span class="tag">'+esc(it.light[0])+'</span>');
    if(it.water) tags.push('<span class="tag">น้ำ'+esc(it.water)+'</span>');
    if(it.care) tags.push('<span class="tag">ดูแล'+esc(it.care)+'</span>');
    if(it.scent==="หอมแรง"||it.scent==="หอมอ่อน") tags.push('<span class="tag scent">'+esc(it.scent)+'</span>');
  }
  var dots=(it.colors||[]).map(function(c){return '<i style="background:'+(COLORMAP[c]||"#999")+'" title="'+esc(c)+'"></i>';}).join("");
  return '<button class="card" data-id="'+esc(it.id)+'" data-cat="'+esc(it.cat)+'">'+
    '<span class="rowbtns">'+
      '<span class="iconbtn" data-act="edit" role="button" tabindex="0" title="แก้ไข"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg></span>'+
      '<span class="iconbtn danger" data-act="del" role="button" tabindex="0" title="ลบ"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span>'+
    '</span>'+
    '<span class="thumb">'+thumb+'</span>'+
    '<span class="card-body">'+
      (it.code?'<span class="pcode">'+esc(it.code)+'</span>':'')+
      '<h4>'+esc(it.name)+'</h4>'+
      (it.sci?'<span class="sci">'+esc(it.sci)+'</span>':'')+
      (it.size?'<span class="size-line">'+esc(it.size)+'</span>':'')+
      '<span class="meta">'+tags.join("")+'</span>'+

function renderList(){
  renderCatbar(); renderRail();
  var cat = F.cat?CATMAP[F.cat]:null;

  var list=DB.items.filter(matches);
  grid.innerHTML=(editing?'<button class="addcard" id="addcard">+ เพิ่มรายการใหม่</button>':"")+list.map(cardHtml).join("");

          DB.items=DB.items.filter(function(x){return x.id!==it.id;});
          setDirty(true); renderList(); toast("ลบแล้ว — กดบันทึกขึ้นเว็บเพื่อยืนยัน");

        return;
      }

/* ---------------- detail ---------------- */
function openDetail(it){
  if(!it) return;
  $("#d-name").textContent=it.name;
  $("#d-sci").textContent=it.sci||"";
  var badge=$("#d-cat"); badge.textContent=CATMAP[it.cat]?CATMAP[it.cat].name:it.cat;
  badge.className="cat-badge"+(it.cat==="hin"?" stone":"");
  var cd=$("#d-code"); if(cd){ cd.textContent=it.code||""; cd.hidden=!it.code; }
  var rows=[];
  function row(k,v){ if(v&&String(v).trim()) rows.push("<dt>"+esc(k)+"</dt><dd>"+esc(v)+"</dd>"); }
  if(it.alt) row("ชื่ออื่น",it.alt);
  row(it.cat==="hin"?"ขนาด":"ความสูง",it.size);
  if(it.cat==="hin"){
    row("การใช้งาน",(it.tags||[]).join(" · "));
    row("สี",(it.colors||[]).join(" · "));
  }else{
    row("แสง",(it.light||[]).join(" / "));
    row("ความต้องการน้ำ",it.water);
    row("การดูแล",it.care);
    if(it.care_note) row("ต้องดูแลอย่างไร",it.care_note);
    if(it.w_m) row("ทรงพุ่มกว้างเมื่อโตเต็มที่",it.w_m+" ม.");
    if(it.r_m) row("ควรห่างจากกำแพงอย่างน้อย",it.r_m+" ม.");
    if(it.flood_ok==="yes") row("น้ำท่วมขัง","ทนได้");
    if(it.flood_ok==="no")  row("น้ำท่วมขัง","ไม่ทน ต้องยกแปลงหรือทำระบายน้ำ");
    row("สีดอก",(it.colors||[]).join(" · "));
    row("กลิ่น",it.scent);
    row("ช่วงออกดอก",it.bloom);
  }
  var body="";
  if(it.img) body+='<img class="hero-img" src="'+esc(it.img)+'" alt="'+esc(it.name)+'">';
  else body+='<div class="thumb'+(it.cat==="hin"?" stone":"")+'" style="aspect-ratio:16/6;border-radius:12px;margin-bottom:18px;align-items:center">'+sil(it.form,it.id)+'</div>';
  body+='<dl class="spec">'+rows.join("")+"</dl>";
  if(it.note) body+='<p class="note-lb">จากหน้างานจริง</p><p class="prose">'+esc(it.note)+"</p>";
  if(it.warnings && it.warnings.length){
    body+='<div class="warnbox"><p class="warn-lb">ข้อควรระวังก่อนเลือกปลูก</p><ul>'+
      it.warnings.map(function(w){return "<li>"+esc(w)+"</li>";}).join("")+'</ul></div>';
  }
  $("#d-body").innerHTML=body;
  var eb=$("#d-edit"); eb.hidden=!editing;
  eb.onclick=function(){ $("#detail").close(); openForm(it); };
  $("#detail").showModal();
}

  var btn=e.submitter;

});

function payload(){
  return JSON.stringify({version:(DB.version||1)+1,updated:new Date().toISOString().slice(0,10),items:DB.items},null,1);
}
function markers(){ return ["<!--"+"ATC_DATA_BEGIN"+"-->","<!--"+"ATC_DATA_END"+"-->"]; }

async function saveToWeb(){
  var btn=$("#savebtn"); btn.disabled=true; btn.textContent="กำลังบันทึก…";
  try{
    if(!artifactApi){ toast("หน้านี้บันทึกขึ้นเว็บไม่ได้ — ใช้ปุ่มส่งออก JSON แทน"); return; }
    var json=payload();
    if(filesFormOk){
      try{
        await artifactApi.publish({"plants.json":{content:json,contentType:"application/json"}});
        DB=JSON.parse(json); setDirty(false); refresh(); toast("บันทึกขึ้นเว็บแล้ว"); return;
      }catch(err){
        if(err&&(err.code==="capability_disabled"||err.code==="read_only_path"||err.code==="capability_removed")) filesFormOk=false;
        else throw err;
      }
    }
    var res=await fetch(location.href,{cache:"no-store"});
    var src=await res.text();
    var m=markers();
    var a=src.indexOf(m[0]), b=src.indexOf(m[1]);
    if(a<0||b<0||b<a){ toast("บันทึกขึ้นเว็บไม่สำเร็จ — ใช้ปุ่มส่งออก JSON แทน"); return; }
    var out=src.slice(0,a)+m[0]+'<script id="plantdata" type="application/json">'+json+"<\/script>"+src.slice(b);
    await artifactApi.publish(out);
    setDirty(false); toast("บันทึกขึ้นเว็บแล้ว");
  }catch(err){
    var code=err&&err.code?err.code:"";
    if(code==="conflict") toast("มีคนบันทึกก่อนหน้านี้ — หน้ากำลังโหลดเวอร์ชันล่าสุด");
    else if(code==="not_writer"||code==="not_granted") toast("บัญชีนี้ดูได้อย่างเดียว แก้ไขไม่ได้");
    else if(code==="too_large") toast("ข้อมูลใหญ่เกินไป ลองลดรูปภาพลง");
    else toast("บันทึกไม่สำเร็จ — ใช้ปุ่มส่งออก JSON เก็บงานไว้ก่อน");
  }finally{ btn.disabled=false; btn.textContent="บันทึกขึ้นเว็บ"; }
}
$("#savebtn").addEventListener("click",saveToWeb);
$("#exportbtn").addEventListener("click",function(){
  $("#j-title").textContent="ส่งออก JSON";
  $("#j-hint").textContent="คัดลอกข้อความนี้เก็บไว้ หรือกดดาวน์โหลดไฟล์ เพื่อนำไปใช้กับเว็บหลักภายหลัง";
  $("#j-text").value=payload();
  $("#j-apply").hidden=true;
  $("#j-download").hidden=!downloadsApi;
  $("#jsondlg").showModal();
});
$("#importbtn").addEventListener("click",function(){
  $("#j-title").textContent="นำเข้า JSON";
  $("#j-hint").textContent="วางข้อมูลรูปแบบเดียวกับที่ส่งออกไว้ แล้วกดนำเข้า ข้อมูลเดิมในหน้านี้จะถูกแทนที่ทั้งหมด";
  $("#j-text").value="";
  $("#j-apply").hidden=false; $("#j-download").hidden=true;
  $("#jsondlg").showModal();
});
$("#j-close").addEventListener("click",function(){$("#jsondlg").close();});
$("#j-apply").addEventListener("click",function(){
  try{
    var d=JSON.parse($("#j-text").value);
    if(!d||!Array.isArray(d.items)) throw new Error("bad");
    DB=d; setDirty(true); refresh(); $("#jsondlg").close();
    toast("นำเข้าแล้ว "+d.items.length+" รายการ — กดบันทึกขึ้นเว็บเพื่อยืนยัน");
  }catch(e){ toast("อ่านข้อมูลไม่ได้ — ตรวจว่าเป็น JSON ที่ถูกต้อง"); }
});
$("#j-download").addEventListener("click",async function(){
  if(!downloadsApi){ toast("ดาวน์โหลดไม่ได้ในหน้านี้ — คัดลอกข้อความแทน"); return; }
  try{ await downloadsApi.save({filename:"always-trees-catalogue.json",data:payload()}); }
  catch(e){ toast("ยกเลิกการดาวน์โหลด"); }
});

/* ---------------- boot ---------------- */
renderCover();
var saved=null; try{saved=sessionStorage.getItem("atc-view");}catch(e){}
setView(saved==="cats"||saved==="list" ? "cats" : "cover");

(async function(){
  try{
    var r=await fetch("plants.json",{cache:"no-store"});
    if(r.ok){
      var d=await r.json();
      if(d&&Array.isArray(d.items)&&d.items.length&&!dirty){ DB=d; refresh(); }
    }
  }catch(e){}
})();

if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){
    artifactApi=a;
    if(!a) $("#editnote").textContent="โหมดแก้ไข — หน้านี้บันทึกขึ้นเว็บไม่ได้ ใช้ส่งออก JSON เก็บงานไว้";
  }).catch(function(){});
  window.claude.use("downloads").then(function(d){downloadsApi=d;}).catch(function(){});
}
})();
</script>
