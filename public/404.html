<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม่พบหน้านี้ | Always Trees</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Poppins:wght@500;700&display=swap">
<style>
:root{
  /* พาเลตต์ Always Trees — ต้นไม้ (เขียว 3) · ดิน (น้ำตาล 2) · ท้องฟ้า (ฟ้า 2) */
  --paper:#FAF9F6;
  --surface:#FFFFFF;
  --tint:#D6EBDA;
  --tint-2:#9CC7A6;
  --forest:#07461E;
  --forest-2:#0A5526;
  --white:#F3F8F4;
  --white-2:#AECBB7;
  --ink:#16211A;
  --ink-2:#4C5C52;
  --muted:#68756D;
  --line:#E4E8E1;
  --line-2:#CBD3C7;
  --brand:#0B8636;
  --brand-dk:#07461E;
  --fresh:#9CC7A6;
  --brown:#6A4E2B;
  --brown-2:#8A6A43;
  --brown-soft:#EBDCCA;
  --green-soft:#D6EBDA;
  --soil:#8A6A43;
  --soil-2:#6A4E2B;
  --sky-soft:#D3E6F3;
  --sky-ink:#20628A;
  --r:22px;
  --r-lg:32px;
  --leaf:52% 14px 52% 14px;
  --sh1:0 1px 2px rgba(18,33,26,.05), 0 5px 14px -8px rgba(18,33,26,.14);
  --sh2:0 2px 6px rgba(18,33,26,.06), 0 18px 36px -18px rgba(18,33,26,.24);
  --sh3:0 4px 10px rgba(18,33,26,.08), 0 30px 60px -26px rgba(18,33,26,.36);
  --shg:0 8px 18px -8px rgba(11,134,54,.45);
  --shg2:0 14px 30px -12px rgba(11,134,54,.55);
  --shb:0 10px 24px -12px rgba(106,78,43,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512; --surface:#171F1A; --tint:#1B2A20; --tint-2:#3A5142;
    --forest:#07120C; --forest-2:#0B1E13;
    --white:#EFF5F0; --white-2:#A2B5A7;
    --ink:#EFF5F0; --ink-2:#BFCCC3; --muted:#8A968D;
    --line:#26302A; --line-2:#38453B;
    --brand:#3FBF69; --brand-dk:#3FBF69; --fresh:#9BD9AF;
    --brown:#C2996C; --brown-2:#A87C4C; --brown-soft:#2A2119;
    --green-soft:#1A2A1F; --soil:#4A3A28; --soil-2:#3C2F20;
    --sky-soft:#16303F; --sky-ink:#8CBEDC;
    --sh1:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -8px rgba(0,0,0,.6);
    --sh2:0 2px 8px rgba(0,0,0,.45), 0 20px 40px -20px rgba(0,0,0,.8);
    --sh3:0 4px 12px rgba(0,0,0,.5), 0 34px 64px -28px rgba(0,0,0,.9);
    --shg:0 8px 18px -8px rgba(53,190,99,.4);
    --shg2:0 14px 30px -12px rgba(53,190,99,.5);
    --shb:0 10px 24px -12px rgba(192,143,94,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --surface:#171F1A; --tint:#1B2A20; --tint-2:#3A5142;
  --forest:#07120C; --forest-2:#0B1E13;
  --white:#EFF5F0; --white-2:#A2B5A7;
  --ink:#EFF5F0; --ink-2:#BFCCC3; --muted:#8A968D;
  --line:#26302A; --line-2:#38453B;
  --brand:#3FBF69; --brand-dk:#3FBF69; --fresh:#9BD9AF;
  --brown:#C2996C; --brown-2:#A87C4C; --brown-soft:#2A2119;
  --green-soft:#1A2A1F; --soil:#4A3A28; --soil-2:#3C2F20;
  --sky-soft:#16303F; --sky-ink:#8CBEDC;
  --sh1:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -8px rgba(0,0,0,.6);
  --sh2:0 2px 8px rgba(0,0,0,.45), 0 20px 40px -20px rgba(0,0,0,.8);
  --sh3:0 4px 12px rgba(0,0,0,.5), 0 34px 64px -28px rgba(0,0,0,.9);
  --shg:0 8px 18px -8px rgba(53,190,99,.4);
  --shg2:0 14px 30px -12px rgba(53,190,99,.5);
  --shb:0 10px 24px -12px rgba(192,143,94,.45);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans Thai","Prompt",system-ui,sans-serif;
  font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:clamp(29px,4.2vw,51px);font-weight:600;line-height:1.24;letter-spacing:-.012em}
h2{font-size:clamp(24px,3.2vw,39px);font-weight:600;line-height:1.32;letter-spacing:-.008em}
h3{font-size:18px;font-weight:600;line-height:1.5;letter-spacing:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}
.eyebrow{font-size:12.5px;font-weight:500;letter-spacing:.15em;color:var(--brand);
  font-family:"Prompt",sans-serif;display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);display:block}
.lede{font-size:clamp(15.5px,1.55vw,18px);color:var(--ink-2);font-weight:300;line-height:1.78}

/* ---------- nav + tabs ---------- */
nav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(14px);transition:box-shadow .3s}
nav.stuck{box-shadow:0 10px 26px -20px rgba(18,33,26,.6)}
nav .wrap{display:flex;align-items:center;gap:18px;height:78px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:none}
.logo .mk{flex:none;display:block;color:var(--brand)}
.logo .wm{font-family:"Poppins",system-ui,sans-serif;font-weight:700;font-size:15.5px;
  letter-spacing:.055em;line-height:1.05;text-transform:uppercase}
.logo .wm small{display:block;font-family:"Noto Sans Thai",sans-serif;font-weight:400;
  font-size:9.5px;letter-spacing:.09em;text-transform:none;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--tint);border-radius:999px;padding:5px;box-shadow:var(--sh1)}
.tabs a{font-family:"Prompt",sans-serif;font-size:14.2px;font-weight:500;text-decoration:none;
  color:var(--ink-2);padding:8px 16px;border-radius:999px;transition:background .22s,color .22s;white-space:nowrap}
.tabs a:hover{color:var(--brand)}
.tabs a[aria-current="true"]{background:var(--brand);color:#FFF;box-shadow:var(--shg)}
:root[data-theme="dark"] .tabs a[aria-current="true"]{color:#08150D}
nav .btn{margin-left:14px}
.burger{display:none;margin-left:auto;width:46px;height:46px;border-radius:15px;border:none;
  background:var(--surface);color:var(--ink);cursor:pointer;align-items:center;justify-content:center;
  box-shadow:var(--sh1);transition:transform .2s,box-shadow .2s}
.burger:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.burger:active{transform:scale(.94)}
@media (max-width:1080px){ .tabs{display:none} nav .btn{display:none} .burger{display:flex} }

.scrim{position:fixed;inset:0;background:rgba(8,18,11,.5);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(310px,84vw);background:var(--surface);
  box-shadow:-24px 0 60px -30px rgba(0,0,0,.55);z-index:80;transform:translateX(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:22px 20px;gap:6px;overflow-y:auto}
.drawer.on{transform:translateX(0)}
.drawer .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer .dhead span{font-family:"Prompt",sans-serif;font-size:12.5px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.drawer button.x{width:42px;height:42px;border-radius:14px;border:none;background:var(--tint);
  color:var(--ink);cursor:pointer;transition:transform .2s}
.drawer button.x:active{transform:scale(.92)}
.drawer a{text-decoration:none;color:var(--ink);font-family:"Prompt",sans-serif;font-size:17px;font-weight:500;
  padding:14px 14px;border-radius:11px;display:flex;align-items:center;gap:12px;transition:background .2s}
.drawer a:hover,.drawer a[aria-current="true"]{background:var(--tint);color:var(--brand)}
.drawer a i{width:7px;height:7px;border-radius:50%;background:var(--brown);flex:none}
.drawer a[aria-current="true"] i{background:var(--brand)}
.drawer .btn{margin-top:12px;justify-content:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:"Prompt",sans-serif;font-size:15px;font-weight:500;
  padding:13px 26px;border-radius:999px;text-decoration:none;border:none;cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.3,.5,1),box-shadow .24s,filter .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-green{background:var(--brand-dk);color:#FFF;box-shadow:var(--shg)}
.btn-green:hover{box-shadow:var(--shg2)}
:root[data-theme="dark"] .btn-green{color:#07130B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-green{color:#07130B}}
.btn-green:hover{filter:brightness(1.1)}
.btn-out{color:var(--ink);background:var(--surface);box-shadow:var(--sh1)}
.btn-out:hover{background:var(--surface);box-shadow:var(--sh2)}
.btn-white{background:var(--white);color:var(--forest);box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.btn-white:hover{box-shadow:0 14px 30px -12px rgba(0,0,0,.7)}

/* ---------- hero slider ---------- */
.hero{padding:30px 0 0}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--forest);box-shadow:var(--sh3)}
.slides{display:flex;transition:transform .62s cubic-bezier(.4,0,.2,1);will-change:transform}
.slide{flex:0 0 100%;position:relative;aspect-ratio:16/9;background:var(--forest-2);overflow:hidden}
@media (max-width:900px){.slide{aspect-ratio:3/4}}
@media (max-width:900px) and (min-height:900px){.slide{aspect-ratio:4/5}}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;display:block}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,rgba(9,22,13,.93) 0%,rgba(9,22,13,.82) 32%,rgba(9,22,13,.25) 62%,rgba(9,22,13,.1) 100%)}
@media (max-width:900px){.veil{background:linear-gradient(to top,rgba(9,22,13,.95) 22%,rgba(9,22,13,.6) 58%,rgba(9,22,13,.2))}}
.creed{position:absolute;inset:0;z-index:3;display:flex;align-items:center;pointer-events:none}
.creed .inner{padding:clamp(26px,4vw,60px);max-width:min(620px,72%);pointer-events:auto}
@media (max-width:900px){.creed{align-items:flex-end}.creed .inner{max-width:none;padding:24px 22px 78px}
  .creed h1{font-size:clamp(25px,6.9vw,35px)}
}
.creed .eyebrow{color:var(--fresh)}
.creed .eyebrow::before{background:var(--fresh)}
.creed h1{color:var(--white);margin-top:14px}
.creed h1 em{font-style:normal;color:var(--fresh)}
.creed p{color:var(--white-2);font-weight:300;margin-top:16px;font-size:clamp(14.5px,1.5vw,16.5px);line-height:1.7;max-width:46ch}
.creed .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.slide .cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:20px 24px 62px;color:var(--white);
  font-size:14px;text-align:right;
  background:linear-gradient(to top,rgba(6,16,9,.8),rgba(6,16,9,0))}
@media (max-width:900px){.slide .cap{display:none}}
.snav{position:absolute;inset:auto 0 0 0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:16px 20px;pointer-events:none}
.dots{display:flex;gap:7px;pointer-events:auto}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:none;cursor:pointer;
  background:color-mix(in srgb,#FFF 45%,transparent);transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:28px;border-radius:999px;background:var(--fresh)}
.arrows{display:flex;gap:8px;pointer-events:auto}
.arrows button{width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,.16);color:#FFF;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);box-shadow:0 8px 20px -10px rgba(0,0,0,.9);
  transition:background .2s,transform .2s}
.arrows button:hover{background:rgba(255,255,255,.3);transform:scale(1.08)}
.arrows button:active{transform:scale(.92)}
.ph{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;text-align:center;padding:26px;color:var(--muted);background:var(--tint)}
.ph b{font-family:"Prompt",sans-serif;font-size:16px;font-weight:600;color:var(--ink-2)}
.ph span{font-size:13.4px;max-width:34ch}
.ph em{font-style:normal;font-family:"Prompt",sans-serif;font-size:12.5px;font-weight:500;letter-spacing:.05em;color:var(--brown)}

/* ---------- sections ---------- */
section{padding:clamp(64px,8vw,112px) 0}
section.tint{background:var(--tint)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:18px 56px;align-items:end;
  margin-bottom:clamp(32px,4.4vw,54px)}
@media (max-width:860px){.head{grid-template-columns:1fr}}
.head .l{display:flex;flex-direction:column;gap:14px}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1000px){.svc{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.svc{grid-template-columns:1fr}}
.svc > div{background:var(--surface);border-radius:var(--r);padding:30px 26px 34px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--sh1);transition:transform .32s cubic-bezier(.34,1.2,.5,1),box-shadow .32s}
.svc > div:hover{transform:translateY(-6px);box-shadow:var(--sh3)}
.svc > div:hover .ic{transform:scale(1.12) rotate(-4deg)}
.svc .ic{color:var(--brand);width:50px;height:50px;border-radius:16px;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:6px;
  transition:transform .34s cubic-bezier(.34,1.4,.5,1);box-shadow:var(--sh1)}
.svc > div:nth-child(2n) .ic{background:var(--brown-soft);color:var(--brown)}
.svc p{font-size:14.8px;color:var(--ink-2);font-weight:300}

.svc .ic{border-radius:var(--leaf)}
.svc > div:hover .ic{transform:scale(1.1) rotate(-8deg)}

/* ---------- ปรัชญา / เสาหลัก (แถบสีน้ำตาล) ---------- */
.soil{background:var(--brown-soft);position:relative;padding:clamp(26px,3.2vw,48px) 0 clamp(30px,4vw,52px)}
.soil .head{margin-bottom:clamp(26px,3.4vw,40px)}
.soil .eyebrow{color:var(--brown)}
.soil .eyebrow::before{background:var(--brown)}
.wave{display:block;width:100%;height:clamp(34px,4.4vw,62px);color:var(--brown-soft);margin-top:-1px}
.wave.up{color:var(--paper)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.pillars{grid-template-columns:1fr}}
.pillars article{background:var(--surface);border-radius:var(--r-lg) var(--r) var(--r-lg) var(--r);
  padding:32px 28px 34px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--sh1);
  transition:transform .34s cubic-bezier(.34,1.2,.5,1),box-shadow .34s}
.pillars article:hover{transform:translateY(-6px);box-shadow:var(--sh3)}
.pillars .ic{width:52px;height:52px;border-radius:var(--leaf);background:var(--brown-soft);color:var(--brown);
  display:flex;align-items:center;justify-content:center;margin-bottom:5px;box-shadow:var(--sh1);
  transition:transform .36s cubic-bezier(.34,1.45,.5,1)}
.pillars article:nth-child(2) .ic{background:var(--green-soft);color:var(--brand)}
.pillars article:hover .ic{transform:scale(1.1) rotate(-8deg)}
.pillars .en{font-family:"Poppins",sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--brown)}
.pillars article:nth-child(2) .en{color:var(--brand)}
.pillars p{font-size:14.9px;color:var(--ink-2);font-weight:300}
.soilnote{margin-top:26px;font-size:14.6px;color:var(--ink-2);font-weight:300;max-width:64ch;line-height:1.8}
.soilnote b{font-weight:500;color:var(--ink)}

/* ---------- หัวข้อย่อยในหมวดบริการ ---------- */
.subhead{display:flex;align-items:baseline;gap:16px;margin:clamp(40px,4.6vw,64px) 0 22px}
.subhead:first-of-type{margin-top:0}
.subhead h3{font-size:clamp(19px,2.2vw,25px);font-weight:600;letter-spacing:-.004em;flex:none}
.subhead .ln{flex:1;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--tint-2),transparent)}
.subhead .n{font-family:"Poppins",sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--brand);flex:none}

/* ---------- แท็บบริการแบบมีเมนูย่อย ---------- */
.tabdrop{position:relative;display:flex}
.tabdrop > a{display:inline-flex;align-items:center;gap:6px}
.tabdrop .cv{transition:transform .25s;opacity:.65}
.tabdrop:hover .cv,.tabdrop:focus-within .cv{transform:rotate(180deg);opacity:1}
.tabmenu{position:absolute;top:calc(100% + 12px);left:50%;transform:translate(-50%,-8px) scale(.97);
  min-width:206px;background:var(--surface);border-radius:20px;padding:9px;box-shadow:var(--sh3);
  display:flex;flex-direction:column;gap:2px;opacity:0;pointer-events:none;transform-origin:top center;
  transition:opacity .24s cubic-bezier(.4,0,.2,1),transform .28s cubic-bezier(.34,1.3,.5,1);z-index:5}
.tabmenu::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.tabdrop:hover .tabmenu,.tabdrop:focus-within .tabmenu{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.tabs .tabmenu a{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:14px;
  font-size:14.6px;font-weight:400;color:var(--ink);transition:background .2s,color .2s,transform .2s}
.tabs .tabmenu a:hover{background:var(--green-soft);color:var(--brand);transform:translateX(3px)}
.tabs .tabmenu a[aria-current="true"]{background:transparent;color:var(--ink);box-shadow:none}
.tabmenu .k{font-family:"Poppins",sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;
  color:var(--brand);flex:none}
.drawer a.sub{position:relative;padding:11px 14px 11px 40px;font-size:14.6px;color:var(--ink-2);font-weight:300}
.drawer a.sub i{display:none}
.drawer a.sub::before{content:"";position:absolute;left:24px;top:calc(50% - 1px);width:8px;height:2px;
  border-radius:2px;background:var(--brand);opacity:.75}

/* ---------- แท็บเครื่องมือ + แบนเนอร์ชวนลอง ---------- */
.tabs a.tool{color:var(--brand);font-weight:500}
.tabs a.tool:hover{background:var(--green-soft)}
.trybox{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:26px 48px;align-items:center;
  background:var(--forest);color:var(--white);border-radius:var(--r-lg) var(--r) var(--r-lg) var(--r);
  padding:clamp(30px,3.6vw,48px);box-shadow:var(--sh2);margin-top:clamp(30px,3.6vw,46px)}
@media (max-width:860px){.trybox{grid-template-columns:1fr}}
.trybox h3{color:var(--white);font-size:clamp(20px,2.4vw,27px);line-height:1.45}
.trybox p{color:var(--white-2);font-weight:300;margin-top:12px;font-size:15.4px;max-width:52ch}
.trybox .eyebrow{color:var(--fresh)}
.trybox .eyebrow::before{background:var(--fresh)}
.trybox .cta{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.trybox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.trybox li{display:flex;gap:11px;font-size:14.6px;color:var(--white-2);font-weight:300;line-height:1.55}
.trybox li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--fresh);margin-top:9px}

/* ---------- process ---------- */
.rail{position:relative;margin-bottom:34px;padding:40px 22px 18px;overflow:visible}
.rail::before{content:"";position:absolute;left:22px;right:22px;top:79px;height:4px;background:var(--brown-soft);border-radius:4px}
.rail .fill{position:absolute;left:22px;top:79px;height:4px;background:var(--brown);border-radius:4px;box-shadow:var(--shb);
  transition:width .5s cubic-bezier(.4,0,.2,1);width:0}
.nodes{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow:visible}
@media (max-width:820px){
  .rail::before,.rail .fill{display:none}
  .nodes{display:flex;overflow-x:auto;gap:12px;padding:26px 14px 18px;
    margin:-26px -14px -18px;scrollbar-width:none;scroll-padding-inline:14px}
  .nodes::-webkit-scrollbar{display:none}
  .nodes button{flex:0 0 116px}
}
.nodes button{background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:10px;font-family:inherit;color:var(--muted)}
.nodes .bub{width:78px;height:78px;border-radius:26px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--brown);box-shadow:var(--sh1);
  transition:transform .36s cubic-bezier(.34,1.45,.5,1),background .28s,color .28s,box-shadow .3s}
.nodes button:hover .bub{transform:translateY(-5px) scale(1.06);box-shadow:var(--shb)}
.nodes button[aria-selected="true"] .bub{background:var(--brand);color:#FFF;
  transform:translateY(-8px) scale(1.16);box-shadow:0 20px 34px -14px rgba(11,134,54,.7)}
.nodes .lb{font-size:12.6px;font-weight:500;line-height:1.35;text-align:center;font-family:"Prompt",sans-serif;
  transition:color .25s}
.nodes button[aria-selected="true"] .lb{color:var(--ink)}
.nodes .no{font-family:"Prompt",sans-serif;font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--brown)}

.panel{position:relative;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh2);
  padding:clamp(28px,3.4vw,42px);min-height:196px;overflow:hidden}
.panel::before{content:"";position:absolute;left:14px;top:22px;bottom:22px;width:5px;border-radius:5px;background:var(--brand)}
.panel .pane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:20px 44px;align-items:start}
@media (max-width:820px){.panel .pane{grid-template-columns:1fr}}
.panel .step{font-family:"Prompt",sans-serif;font-size:13px;font-weight:500;letter-spacing:.05em;color:var(--brown)}
.panel h3{font-size:clamp(20px,2.4vw,27px);font-weight:600;margin-top:10px;letter-spacing:0;line-height:1.4}
.panel p{color:var(--ink-2);font-weight:300;margin-top:12px;font-size:15.6px}
.panel .fee{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:#FFF;
  background:var(--brand);padding:8px 17px;border-radius:999px;font-weight:500;box-shadow:var(--shg)}
:root[data-theme="dark"] .panel .fee{color:#08150D}
.panel .art{border-radius:12px;overflow:hidden;background:var(--tint);aspect-ratio:16/10;position:relative}
.fadein{animation:fadein .44s cubic-bezier(.4,0,.2,1)}
@keyframes pulse{
  0%{box-shadow:var(--shg), 0 0 0 0 rgba(23,164,74,.42)}
  70%{box-shadow:var(--shg), 0 0 0 16px rgba(23,164,74,0)}
  100%{box-shadow:var(--shg), 0 0 0 0 rgba(23,164,74,0)}
}
.creed .btn-green{animation:pulse 3.6s ease-out infinite}
.creed .btn-green:hover{animation:none}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* folio */
.folio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:1000px){.folio{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.folio{grid-template-columns:1fr}}
.fcard{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;cursor:pointer;margin:0;
  box-shadow:var(--sh1);transition:transform .32s cubic-bezier(.34,1.2,.5,1),box-shadow .32s}
.fcard:hover{transform:translateY(-6px) scale(1.012);box-shadow:var(--sh3)}
.fcard:active{transform:scale(.99)}
.fcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .55s ease,transform 6s ease}
.fcard .b{opacity:0}
.fcard.flip .b{opacity:1}
.fcard.flip .a{opacity:0}
.fcard:hover img{transform:scale(1.04)}
.fcard figcaption{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:44px 18px 16px;color:#fff;
  background:linear-gradient(to top,rgba(6,16,9,.86),rgba(6,16,9,0));display:flex;flex-direction:column;gap:3px}
.fcard figcaption .t{font-family:"Prompt",sans-serif;font-size:15.5px;font-weight:500;line-height:1.4}
.fcard figcaption .s{font-size:12.6px;color:rgba(255,255,255,.78)}
.fcard .badge{position:absolute;top:14px;left:14px;z-index:3;font-family:"Prompt",sans-serif;
  font-size:12.5px;font-weight:500;letter-spacing:.05em;color:#fff;background:rgba(6,16,9,.55);backdrop-filter:blur(6px);
  padding:6px 12px;border-radius:999px;transition:background .3s}
.fcard.flip .badge{background:var(--brown)}
.fcard .hint{position:absolute;top:14px;right:14px;z-index:3;font-size:11.5px;color:#fff;
  background:rgba(6,16,9,.5);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;
  opacity:1;transition:opacity .3s}
.fcard:hover .hint{opacity:0}
.slot{aspect-ratio:4/3;border-radius:var(--r);background:var(--surface);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;
  padding:20px;color:var(--muted);box-shadow:var(--sh1);
  transition:transform .32s cubic-bezier(.34,1.2,.5,1),box-shadow .32s,background .3s}
.slot:hover{transform:translateY(-6px) scale(1.015);box-shadow:var(--sh3);background:var(--tint)}
.slot:active{transform:scale(.99)}
.slot .k{font-family:"Prompt",sans-serif;font-size:12.5px;font-weight:500;letter-spacing:.05em;color:var(--brown)}
.slot .c{font-size:13.6px;font-weight:300;max-width:24ch}

/* land tax */
.tax{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:34px 54px;align-items:center}
@media (max-width:940px){.tax{grid-template-columns:1fr}}
.taxlist{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.taxlist li{display:flex;gap:13px;font-size:15.4px;color:var(--ink-2);font-weight:300;line-height:1.62}
.taxlist li b{color:var(--ink);font-weight:600}
.taxlist li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--brown);margin-top:10px}
.taxslider{border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--sh2);position:relative}
.taxslider .slide{aspect-ratio:4/3!important}

/* faq */
details{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh1);margin-bottom:12px;
  transition:box-shadow .3s,transform .3s}
details:hover{box-shadow:var(--sh2)}
details[open]{box-shadow:var(--sh2)}
details summary{cursor:pointer;padding:22px 26px;list-style:none;display:flex;justify-content:space-between;gap:26px;
  align-items:baseline;font-family:"Prompt",sans-serif;font-size:clamp(16px,1.7vw,18.5px);font-weight:500;line-height:1.55}
details summary::-webkit-details-marker{display:none}
details summary .pl{color:var(--brand);font-family:"Prompt",sans-serif;font-size:19px;font-weight:400;flex:none;transition:transform .22s}
details[open] summary .pl{transform:rotate(45deg)}
details .ans{padding:0 26px 26px;color:var(--ink-2);font-weight:300;font-size:15.4px;max-width:72ch}
.faqtop{display:flex;flex-direction:column}

/* contact */
.chan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:clamp(28px,4vw,42px)}
@media (max-width:900px){.chan{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.chan{grid-template-columns:repeat(2,1fr);gap:12px}.chan a{padding:24px 12px 26px}}
.chan a{background:var(--surface);border-radius:var(--r-lg) var(--r) var(--r-lg) var(--r);position:relative;overflow:hidden;
  padding:30px 20px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  min-height:0;box-shadow:var(--sh1);text-align:center;
  transition:transform .32s cubic-bezier(.34,1.2,.5,1),box-shadow .32s}
.chan a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--brand);
  transform:scaleX(0);transform-origin:left;transition:transform .36s cubic-bezier(.4,0,.2,1)}
.chan a:hover{transform:translateY(-7px);box-shadow:var(--sh3)}
.chan a:hover::after{transform:scaleX(1)}
.chan a:hover .ic{transform:scale(1.12) rotate(-5deg)}
.chan a:active{transform:translateY(-2px) scale(.99)}
.chan .ic{width:56px;height:56px;border-radius:var(--leaf);background:var(--green-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1);
  transition:transform .34s cubic-bezier(.34,1.4,.5,1)}
.chan a:nth-child(2n) .ic{background:var(--brown-soft);color:var(--brown)}
.chan a:hover .ic{transform:scale(1.12) rotate(-8deg)}
.chan .lbl{font-family:"Prompt",sans-serif;font-size:16px;font-weight:500;letter-spacing:-.005em;
  color:var(--ink);line-height:1.4;word-break:break-word}

.checklist{margin-top:18px;background:var(--forest);color:var(--white);border-radius:var(--r);box-shadow:var(--sh2);
  padding:30px 32px 34px;display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:18px 40px}
@media (max-width:820px){.checklist{grid-template-columns:1fr}}
.checklist h3{color:var(--white)}
.checklist ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
@media (max-width:620px){.checklist ul{grid-template-columns:1fr}}
.checklist li{display:flex;gap:11px;font-size:14.6px;color:var(--white-2);font-weight:300;line-height:1.55}
.checklist li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--fresh);margin-top:9px}

footer{padding:40px 0 56px}
footer .wrap{display:flex;justify-content:center}
footer b{font-family:"Poppins",sans-serif;font-weight:500;font-size:13.4px;letter-spacing:.05em;color:var(--muted)}
