services:
  - type: web
    name: alwaystrees
    runtime: node
    plan: free
    region: singapore          # ใกล้ไทยที่สุด
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://alwaystrees.onrender.com
      - key: NOINDEX
        value: "true"
      - key: MONGODB_URI
        sync: false            # ใส่เองในหน้า Render ไม่เก็บลง git
      - key: MONGODB_DB
        value: alwaystrees
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      # อายุการล็อกอินหลังบ้าน — คุกกี้เป็นแบบ session อยู่แล้ว ปิดเบราว์เซอร์ก็หลุด
      # สองค่านี้คือ "ไม่แตะกี่นาทีให้ถามรหัสใหม่" และ "เพดานรวมกี่ชั่วโมง"
      - key: ADMIN_IDLE_MINUTES
        value: "30"
      - key: ADMIN_ABSOLUTE_HOURS
        value: "12"
