name: เตือนสำรองข้อมูลรายเดือน

# ยิงทุกวันที่ 1 เวลา 09:00 น. ไทย (02:00 UTC)
# ระบบจะส่งอีเมลที่มีปุ่มกดดาวน์โหลดข้อมูลไปให้
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: เรียก /api/cron/backup-reminder
        run: |
          curl -sS -X POST --max-time 120 --retry 3 --retry-delay 30 \
            -H "x-cron-token: ${{ secrets.CRON_TOKEN }}" \
            "${{ secrets.APP_URL }}/api/cron/backup-reminder"
